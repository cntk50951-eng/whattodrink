<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Whattodrink — Vintage Tiki</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bungee+Shade&family=Limelight&family=Caveat:wght@500;700&family=Work+Sans:wght@400;700&family=Noto+Sans+TC:wght@500;700;900&family=Bebas+Neue&family=Lobster&display=swap" rel="stylesheet" />
<style>
:root {
  --sun-deep:   #D04A1F;
  --sun-mid:    #E97A2A;
  --sun-core:   #F5B95A;
  --ocean-dark: #1F4A45;
  --ocean-mid:  #2F6660;
  --sky-edge:   #0F1F2A;
  --paper:      #EFE3C8;
  --ink:        #1A0F0A;
  --hibiscus:   #E84A26;
  --leaf:       #3F4F1A;
  --leaf-mid:   #5C6B2A;
  --tiki-warm:  #B85A1F;
  --tiki-dark:  #A8431B;
  --flame:      #FFC649;
  --drink-red:  #C8331E;
  --drink-orange: #E25822;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: "Work Sans", "Noto Sans TC", sans-serif;
  background: var(--paper);
  color: var(--ink);
  min-height: 100vh;
  background-image:
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence baseFrequency='0.7' numOctaves='2'/><feColorMatrix values='0 0 0 0 0.4 0 0 0 0 0.3 0 0 0 0 0.2 0 0 0 0.18 0'/></filter><rect width='200' height='200' filter='url(%23n)'/></svg>");
}

/* HEADER */
header {
  position: relative;
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 24px 40px;
  background: var(--tiki-warm);
  border-bottom: 5px solid var(--ink);
  color: var(--paper);
}
.brand {
  font-family: "Limelight", "Bungee Shade", "Noto Sans TC", sans-serif;
  font-size: 28px;
  color: var(--paper);
  text-shadow: 2px 2px 0 var(--ink);
  letter-spacing: 0.05em;
}
.brand .accent { color: var(--sun-core); }
.nav-links {
  display: flex;
  gap: 32px;
  font-family: "Bebas Neue", "Noto Sans TC", sans-serif;
  font-size: 18px;
  letter-spacing: 0.1em;
  color: var(--paper);
}
.nav-links a { color: var(--paper); }
.style-badge {
  font-family: "Limelight", serif;
  font-size: 18px;
  background: var(--sun-core);
  color: var(--ink);
  padding: 6px 18px;
  border: 3px solid var(--ink);
  transform: rotate(-3deg);
  box-shadow: 4px 4px 0 0 var(--ink);
}

/* HERO */
.hero {
  position: relative;
  min-height: calc(100vh - 100px);
  overflow: hidden;
  background: var(--paper);
  /* inner weathered border */
  border: 18px solid var(--paper);
  box-shadow: inset 0 0 0 2px var(--ink);
}

.hero-svg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}

.hero-text {
  position: relative;
  z-index: 5;
  max-width: 1280px;
  margin: 0 auto;
  padding: 50px 64px 30px;
}

.eyebrow {
  display: inline-block;
  font-family: "Bebas Neue", "Noto Sans TC", sans-serif;
  font-size: 22px;
  background: var(--hibiscus);
  color: var(--paper);
  border: 3px solid var(--ink);
  padding: 4px 14px;
  letter-spacing: 0.12em;
  box-shadow: 4px 4px 0 0 var(--ink);
  transform: rotate(-2deg);
  margin-bottom: 24px;
}

.hero-title {
  font-family: "Limelight", "Bungee Shade", "Noto Sans TC", serif;
  font-size: clamp(48px, 8vw, 108px);
  line-height: 0.95;
  color: var(--paper);
  text-shadow:
    4px 4px 0 var(--ink),
    8px 8px 0 var(--sun-deep);
  letter-spacing: 0.05em;
  margin-bottom: 18px;
}
.hero-title .accent {
  color: var(--sun-core);
  -webkit-text-stroke: 1.5px var(--ink);
}

.hero-sub {
  font-family: "Caveat", cursive;
  font-size: 26px;
  color: var(--ink);
  max-width: 480px;
  margin-bottom: 32px;
  background: var(--paper);
  display: inline-block;
  padding: 6px 14px;
  border: 2px solid var(--ink);
  transform: rotate(-1.5deg);
}

.cta-row { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }

.btn-primary {
  background: var(--hibiscus);
  color: var(--paper);
  border: 4px solid var(--ink);
  padding: 16px 28px;
  font-family: "Bebas Neue", "Noto Sans TC", sans-serif;
  font-size: 22px;
  letter-spacing: 0.1em;
  cursor: pointer;
  box-shadow: 5px 5px 0 0 var(--ink);
  transition: transform 0.1s, box-shadow 0.1s;
}
.btn-primary:hover { transform: translate(-2px, -2px); box-shadow: 7px 7px 0 0 var(--ink); }
.btn-primary:active { transform: translate(3px, 3px); box-shadow: 0 0 0 0 var(--ink); }

.btn-secondary {
  background: var(--paper);
  color: var(--ink);
  border: 4px solid var(--ink);
  padding: 14px 24px;
  font-family: "Bebas Neue", "Noto Sans TC", sans-serif;
  font-size: 18px;
  letter-spacing: 0.1em;
  cursor: pointer;
  box-shadow: 4px 4px 0 0 var(--ink);
}

/* FEATURES */
.features {
  position: relative;
  background: var(--tiki-warm);
  padding: 60px 64px;
  border-top: 5px solid var(--ink);
  border-bottom: 5px solid var(--ink);
}
.features::before {
  content: "";
  position: absolute;
  inset: 0;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='40' height='40'><circle cx='10' cy='10' r='1.5' fill='%23EFE3C8' opacity='0.2'/></svg>");
  background-size: 40px 40px;
}
.features-grid {
  position: relative;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 28px;
  max-width: 1280px;
  margin: 0 auto;
}
.feature-card {
  background: var(--paper);
  border: 4px solid var(--ink);
  padding: 28px;
  box-shadow: 6px 6px 0 0 var(--ocean-dark);
  transform: rotate(var(--rot, 0deg));
  transition: transform 0.15s;
}
.feature-card:nth-child(1) { --rot: -1.5deg; }
.feature-card:nth-child(2) { --rot: 1deg; }
.feature-card:nth-child(3) { --rot: -0.5deg; }
.feature-card:hover { transform: rotate(0deg) scale(1.02); }
.feature-card .num {
  font-family: "Limelight", serif;
  font-size: 36px;
  color: var(--hibiscus);
  line-height: 1;
  margin-bottom: 4px;
}
.feature-card h3 {
  font-family: "Bebas Neue", "Noto Sans TC", sans-serif;
  font-size: 22px;
  color: var(--ink);
  letter-spacing: 0.1em;
  margin: 8px 0;
}
.feature-card p {
  font-family: "Caveat", cursive;
  font-size: 20px;
  color: var(--ink);
}

footer {
  background: var(--ink);
  color: var(--sun-core);
  text-align: center;
  padding: 20px;
  font-family: "Bebas Neue", sans-serif;
  font-size: 16px;
  letter-spacing: 0.15em;
}
</style>
</head>
<body>

<header>
  <div class="brand">whattodrink<span class="accent">·</span></div>
  <nav class="nav-links">
    <a href="#">今晚</a>
    <a href="#">酒吧</a>
    <a href="#">心情</a>
    <a href="#">關於</a>
  </nav>
  <div class="style-badge">Tiki</div>
</header>

<section class="hero">

  <svg class="hero-svg" viewBox="0 0 1280 720" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <pattern id="grain" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse">
        <circle cx="10" cy="15" r="1" fill="#1A0F0A" opacity="0.18"/>
        <circle cx="40" cy="30" r="1.2" fill="#1A0F0A" opacity="0.15"/>
        <circle cx="70" cy="10" r="0.8" fill="#1A0F0A" opacity="0.2"/>
        <circle cx="20" cy="60" r="1" fill="#1A0F0A" opacity="0.15"/>
        <circle cx="55" cy="75" r="1.3" fill="#1A0F0A" opacity="0.18"/>
        <circle cx="85" cy="50" r="0.8" fill="#1A0F0A" opacity="0.2"/>
        <circle cx="5" cy="85" r="1" fill="#1A0F0A" opacity="0.15"/>
        <circle cx="65" cy="95" r="0.9" fill="#1A0F0A" opacity="0.18"/>
      </pattern>
    </defs>

    <!-- ===== SKY (radial sunset) ===== -->
    <defs>
      <radialGradient id="sunset" cx="50%" cy="62%" r="60%">
        <stop offset="0%"  stop-color="#F5B95A"/>
        <stop offset="35%" stop-color="#E97A2A"/>
        <stop offset="70%" stop-color="#D04A1F"/>
        <stop offset="100%" stop-color="#5C2A1A"/>
      </radialGradient>
    </defs>
    <rect x="0" y="0" width="1280" height="500" fill="url(#sunset)"/>

    <!-- outer sky band (deep blue-green) -->
    <rect x="0" y="0" width="1280" height="180" fill="#0F1F2A" opacity="0.6"/>
    <!-- sky grain -->
    <rect x="0" y="0" width="1280" height="500" fill="url(#grain)" opacity="0.4"/>

    <!-- distant mountains (low silhouettes) -->
    <path d="M 0 460 L 200 440 L 350 455 L 500 435 L 700 450 L 900 440 L 1100 460 L 1280 445 L 1280 500 L 0 500 Z" fill="#1F4A45" opacity="0.85"/>
    <path d="M 0 480 L 200 470 L 400 480 L 600 472 L 800 480 L 1000 475 L 1280 478 L 1280 500 L 0 500 Z" fill="#2F6660" opacity="0.7"/>

    <!-- ===== OCEAN ===== -->
    <rect x="0" y="500" width="1280" height="220" fill="#1F4A45"/>
    <!-- ocean wave highlights (horizontal short lines) -->
    <g stroke="#2F6660" stroke-width="2" fill="none" opacity="0.7">
      <line x1="50"  y1="520" x2="180" y2="520"/>
      <line x1="280" y1="520" x2="380" y2="520"/>
      <line x1="500" y1="525" x2="620" y2="525"/>
      <line x1="800" y1="525" x2="900" y2="525"/>
      <line x1="1050" y1="525" x2="1180" y2="525"/>
      <line x1="100" y1="540" x2="220" y2="540"/>
      <line x1="400" y1="540" x2="500" y2="540"/>
      <line x1="700" y1="540" x2="800" y2="540"/>
      <line x1="950" y1="540" x2="1080" y2="540"/>
      <line x1="200" y1="555" x2="320" y2="555"/>
      <line x1="500" y1="555" x2="600" y2="555"/>
      <line x1="800" y1="555" x2="900" y2="555"/>
    </g>
    <g stroke="#4A8A82" stroke-width="1.5" fill="none" opacity="0.4">
      <line x1="150" y1="565" x2="250" y2="565"/>
      <line x1="450" y1="570" x2="550" y2="570"/>
      <line x1="750" y1="565" x2="850" y2="565"/>
      <line x1="1050" y1="570" x2="1180" y2="570"/>
    </g>
    <!-- ocean darker shadow band -->
    <rect x="0" y="640" width="1280" height="80" fill="#0A2624" opacity="0.4"/>

    <!-- ===== PALM FRONDS (black silhouettes, top corners) ===== -->
    <g fill="#1A0F0A">
      <!-- top-left cluster -->
      <g>
        <path d="M 0 0 L 0 200 Q 50 180 120 150 Q 200 110 280 60 Q 360 30 460 10 L 440 0 Z"/>
        <path d="M 0 0 L 0 240 Q 30 220 80 200 Q 140 180 200 160 Q 260 140 320 120 Q 380 100 420 70 L 400 0 Z"/>
        <path d="M 100 0 L 110 80 Q 130 90 160 100 Q 200 110 240 130 L 220 0 Z"/>
      </g>
      <!-- top-right cluster -->
      <g>
        <path d="M 1280 0 L 1280 200 Q 1230 180 1160 150 Q 1080 110 1000 60 Q 920 30 820 10 L 840 0 Z"/>
        <path d="M 1280 0 L 1280 240 Q 1250 220 1200 200 Q 1140 180 1080 160 Q 1020 140 960 120 Q 900 100 860 70 L 880 0 Z"/>
        <path d="M 1180 0 L 1170 80 Q 1150 90 1120 100 Q 1080 110 1040 130 L 1060 0 Z"/>
      </g>
    </g>

    <!-- ===== TIKI TOTEM COLUMN LEFT (with face + torch on top) ===== -->
    <g transform="translate(160,260)">
      <!-- column body (slightly tapered) -->
      <path d="M 0 0 L 80 0 L 90 380 L -10 380 Z" fill="#B85A1F" stroke="#1A0F0A" stroke-width="4" stroke-linejoin="round"/>
      <!-- wood grain hatching -->
      <g stroke="#7A3A0F" stroke-width="1.5" fill="none" opacity="0.6">
        <line x1="5" y1="50" x2="75" y2="50"/>
        <line x1="5" y1="100" x2="78" y2="100"/>
        <line x1="3" y1="150" x2="80" y2="150"/>
        <line x1="0" y1="200" x2="82" y2="200"/>
        <line x1="-3" y1="250" x2="84" y2="250"/>
        <line x1="-5" y1="300" x2="86" y2="300"/>
        <line x1="-7" y1="350" x2="88" y2="350"/>
      </g>
      <!-- face: eyes (oval) -->
      <ellipse cx="22" cy="100" rx="10" ry="6" fill="#1A0F0A"/>
      <ellipse cx="58" cy="100" rx="10" ry="6" fill="#1A0F0A"/>
      <!-- nose (wide) -->
      <path d="M 30 130 L 50 130 L 55 165 L 25 165 Z" fill="#7A3A0F" stroke="#1A0F0A" stroke-width="2"/>
      <!-- mouth with teeth (open, showing teeth) -->
      <rect x="15" y="190" width="50" height="30" fill="#1A0F0A"/>
      <rect x="20" y="195" width="6" height="6" fill="#EFE3C8"/>
      <rect x="30" y="195" width="6" height="6" fill="#EFE3C8"/>
      <rect x="40" y="195" width="6" height="6" fill="#EFE3C8"/>
      <rect x="50" y="195" width="6" height="6" fill="#EFE3C8"/>
      <rect x="22" y="210" width="6" height="6" fill="#EFE3C8"/>
      <rect x="32" y="210" width="6" height="6" fill="#EFE3C8"/>
      <rect x="42" y="210" width="6" height="6" fill="#EFE3C8"/>
      <rect x="52" y="210" width="6" height="6" fill="#EFE3C8"/>
      <!-- brow ridge -->
      <rect x="10" y="80" width="60" height="6" fill="#1A0F0A"/>
      <!-- small shrine top -->
      <rect x="-10" y="-30" width="100" height="30" fill="#B85A1F" stroke="#1A0F0A" stroke-width="3"/>
      <polygon points="-10,-30 90,-30 40,-70" fill="#B85A1F" stroke="#1A0F0A" stroke-width="3"/>
      <!-- torch on top (flame) -->
      <line x1="40" y1="-70" x2="40" y2="-90" stroke="#1A0F0A" stroke-width="3"/>
      <path d="M 30 -90 Q 35 -110 40 -100 Q 45 -110 50 -90 Q 45 -85 40 -82 Q 35 -85 30 -90 Z" fill="#FFC649" stroke="#E97A2A" stroke-width="1.5"/>
    </g>

    <!-- ===== TIKI TOTEM COLUMN RIGHT (with face + leaf crown) ===== -->
    <g transform="translate(1040,260)">
      <path d="M 0 0 L 80 0 L 90 380 L -10 380 Z" fill="#A8431B" stroke="#1A0F0A" stroke-width="4" stroke-linejoin="round"/>
      <g stroke="#6B2A0F" stroke-width="1.5" fill="none" opacity="0.6">
        <line x1="5" y1="50" x2="75" y2="50"/>
        <line x1="5" y1="100" x2="78" y2="100"/>
        <line x1="3" y1="150" x2="80" y2="150"/>
        <line x1="0" y1="200" x2="82" y2="200"/>
        <line x1="-3" y1="250" x2="84" y2="250"/>
        <line x1="-5" y1="300" x2="86" y2="300"/>
        <line x1="-7" y1="350" x2="88" y2="350"/>
      </g>
      <!-- angular eyes -->
      <polygon points="14,95 30,90 28,108" fill="#1A0F0A"/>
      <polygon points="66,95 50,90 52,108" fill="#1A0F0A"/>
      <!-- longer nose -->
      <path d="M 28 125 L 52 125 L 50 175 L 30 175 Z" fill="#6B2A0F" stroke="#1A0F0A" stroke-width="2"/>
      <!-- mouth with more teeth (more savage) -->
      <rect x="12" y="190" width="56" height="35" fill="#1A0F0A"/>
      <rect x="16" y="195" width="5" height="8" fill="#EFE3C8"/>
      <rect x="24" y="195" width="5" height="8" fill="#EFE3C8"/>
      <rect x="32" y="195" width="5" height="8" fill="#EFE3C8"/>
      <rect x="40" y="195" width="5" height="8" fill="#EFE3C8"/>
      <rect x="48" y="195" width="5" height="8" fill="#EFE3C8"/>
      <rect x="56" y="195" width="5" height="8" fill="#EFE3C8"/>
      <rect x="18" y="213" width="5" height="8" fill="#EFE3C8"/>
      <rect x="26" y="213" width="5" height="8" fill="#EFE3C8"/>
      <rect x="34" y="213" width="5" height="8" fill="#EFE3C8"/>
      <rect x="42" y="213" width="5" height="8" fill="#EFE3C8"/>
      <rect x="50" y="213" width="5" height="8" fill="#EFE3C8"/>
      <rect x="58" y="213" width="5" height="8" fill="#EFE3C8"/>
      <rect x="6" y="80" width="68" height="6" fill="#1A0F0A"/>
      <!-- leaf crown (Anubis-like) -->
      <path d="M 5 -10 L 40 -90 L 75 -10 Z" fill="#A8431B" stroke="#1A0F0A" stroke-width="3"/>
      <line x1="40" y1="-10" x2="40" y2="-90" stroke="#1A0F0A" stroke-width="2"/>
      <line x1="22" y1="-40" x2="58" y2="-40" stroke="#1A0F0A" stroke-width="1.5"/>
    </g>

    <!-- ===== COCKTAIL GLASS (hurricane shape) center bottom ===== -->
    <g transform="translate(540,360)">
      <!-- shadow under base -->
      <ellipse cx="100" cy="305" rx="90" ry="12" fill="#1A0F0A" opacity="0.6"/>

      <!-- stem -->
      <rect x="92" y="220" width="16" height="60" fill="#EFE3C8" stroke="#1A0F0A" stroke-width="3"/>
      <ellipse cx="100" cy="220" rx="14" ry="6" fill="#EFE3C8" stroke="#1A0F0A" stroke-width="3"/>
      <ellipse cx="100" cy="280" rx="20" ry="8" fill="#EFE3C8" stroke="#1A0F0A" stroke-width="3"/>

      <!-- glass body (hurricane: wide top, taper to stem) -->
      <path d="M 30 0 L 170 0 L 160 60 L 150 100 L 140 150 L 130 200 L 110 220 L 90 220 L 70 200 L 60 150 L 50 100 L 40 60 Z"
            fill="#EFE3C8" fill-opacity="0.6" stroke="#1A0F0A" stroke-width="4" stroke-linejoin="round"/>

      <!-- drink liquid (red-orange gradient) -->
      <defs>
        <linearGradient id="drink" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#E25822"/>
          <stop offset="100%" stop-color="#C8331E"/>
        </linearGradient>
      </defs>
      <path d="M 35 30 L 165 30 L 156 70 L 148 105 L 138 150 L 128 200 L 112 215 L 88 215 L 72 200 L 62 150 L 52 105 L 44 70 Z"
            fill="url(#drink)"/>

      <!-- ice cubes inside drink -->
      <g stroke="#1A0F0A" stroke-width="1.5" fill="#F5EDD8" fill-opacity="0.7">
        <polygon points="60,80 90,70 100,90 75,100" />
        <polygon points="100,60 130,55 135,80 110,90" />
        <polygon points="80,120 115,115 120,140 90,145" />
      </g>

      <!-- glass highlight on left -->
      <path d="M 40 30 L 50 200" stroke="#FFFFFF" stroke-width="4" opacity="0.55" fill="none"/>
      <ellipse cx="50" cy="50" rx="8" ry="14" fill="#FFFFFF" opacity="0.5"/>

      <!-- 2 crossed black straws (X shape) -->
      <line x1="80" y1="-30" x2="140" y2="180" stroke="#1A0F0A" stroke-width="6" stroke-linecap="round"/>
      <line x1="140" y1="-30" x2="80" y2="180" stroke="#1A0F0A" stroke-width="6" stroke-linecap="round"/>

      <!-- paper umbrella (red+yellow stripes) on right side of glass rim -->
      <g transform="translate(160,10)">
        <line x1="0" y1="0" x2="0" y2="60" stroke="#1A0F0A" stroke-width="2"/>
        <path d="M 0 0 Q -25 -5 -30 -15 Q -10 -20 0 -15 Q 10 -22 25 -18 Q 35 -25 40 -10 Q 30 -2 0 0 Z"
              fill="#C8331E" stroke="#1A0F0A" stroke-width="2" stroke-linejoin="round"/>
        <!-- umbrella stripes (radial) -->
        <g stroke="#FFC649" stroke-width="2" fill="none">
          <line x1="-25" y1="-10" x2="0" y2="0"/>
          <line x1="-12" y1="-22" x2="0" y2="0"/>
          <line x1="0" y1="-25" x2="0" y2="0"/>
          <line x1="15" y1="-22" x2="0" y2="0"/>
          <line x1="28" y1="-15" x2="0" y2="0"/>
        </g>
        <!-- top knob -->
        <circle cx="0" cy="-25" r="3" fill="#1A0F0A"/>
      </g>
    </g>

    <!-- ===== HIBISCUS FLOWER (right foreground) ===== -->
    <g transform="translate(880,500)">
      <g stroke="#1A0F0A" stroke-width="2.5" stroke-linejoin="round">
        <ellipse cx="0" cy="0" rx="28" ry="14" fill="#E84A26" transform="rotate(0)"/>
        <ellipse cx="0" cy="0" rx="28" ry="14" fill="#E84A26" transform="rotate(72)"/>
        <ellipse cx="0" cy="0" rx="28" ry="14" fill="#E84A26" transform="rotate(144)"/>
        <ellipse cx="0" cy="0" rx="28" ry="14" fill="#E84A26" transform="rotate(216)"/>
        <ellipse cx="0" cy="0" rx="28" ry="14" fill="#E84A26" transform="rotate(288)"/>
      </g>
      <circle cx="0" cy="0" r="6" fill="#FFC649" stroke="#1A0F0A" stroke-width="2"/>
      <line x1="0" y1="0" x2="0" y2="-30" stroke="#FFC649" stroke-width="2.5"/>
    </g>

    <!-- ===== HIBISCUS FLOWER (left foreground) ===== -->
    <g transform="translate(360,540)">
