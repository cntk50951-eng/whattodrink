<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Whattodrink — [STYLE_NAME]</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;700&family=Archivo+Black&family=Bangers&family=Big+Shoulders+Display:wght@700&family=Playfair+Display:wght@700;900&family=Caveat:wght@500;700&family=Patrick+Hand&family=Inter:wght@500;700&family=Mochiy+Pop+One&display=swap" rel="stylesheet" />
<style>
/* ============================================================
   THEME TOKENS — 10 風格各一組 CSS 變數
   用 [data-theme="..."] 切換整頁
   ============================================================ */

:root,
[data-theme="ligne-claire"] {
  --bg: oklch(0.96 0.01 80);
  --fg: oklch(0.22 0.02 260);
  --card: oklch(1 0 0);
  --card-fg: oklch(0.22 0.02 260);
  --muted: oklch(0.93 0.02 80);
  --muted-fg: oklch(0.50 0.02 260);
  --primary: oklch(0.70 0.16 65);
  --primary-fg: oklch(0.15 0.02 260);
  --accent: oklch(0.62 0.13 200);
  --border: oklch(0.85 0.02 80);
  --ink: oklch(0.18 0.02 260);
  --font-display: "Work Sans", sans-serif;
  --font-body: "Work Sans", sans-serif;
  --radius: 4px;
  --border-width: 2px;
  --pattern: none;
}

[data-theme="memphis"] {
  --bg: oklch(0.92 0.13 95);
  --fg: oklch(0.18 0 0);
  --card: oklch(1 0 0);
  --card-fg: oklch(0.18 0 0);
  --muted: oklch(0.92 0.16 340);
  --muted-fg: oklch(0.18 0 0);
  --primary: oklch(0.68 0.24 5);
  --primary-fg: oklch(1 0 0);
  --accent: oklch(0.70 0.18 200);
  --border: oklch(0.18 0 0);
  --ink: oklch(0.18 0 0);
  --font-display: "Archivo Black", sans-serif;
  --font-body: "Archivo Black", sans-serif;
  --radius: 8px;
  --border-width: 3px;
  --pattern: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='40' height='40'><circle cx='10' cy='10' r='2' fill='%23000'/><circle cx='30' cy='30' r='2' fill='%23000'/></svg>");
}

[data-theme="pop-art"] {
  --bg: oklch(0.62 0.24 28);
  --fg: oklch(0.98 0 0);
  --card: oklch(0.92 0.18 95);
  --card-fg: oklch(0.10 0 0);
  --muted: oklch(0.55 0.18 235);
  --muted-fg: oklch(0.98 0 0);
  --primary: oklch(0.88 0.20 95);
  --primary-fg: oklch(0.10 0 0);
  --accent: oklch(0.10 0 0);
  --border: oklch(0.10 0 0);
  --ink: oklch(0.10 0 0);
  --font-display: "Bangers", sans-serif;
  --font-body: "Bangers", sans-serif;
  --radius: 0;
  --border-width: 4px;
  --pattern: radial-gradient(circle, oklch(0.10 0 0 / 0.18) 1px, transparent 2px);
  background-size: 6px 6px;
}

[data-theme="vintage-tiki"] {
  --bg: oklch(0.82 0.13 75);
  --fg: oklch(0.18 0.04 50);
  --card: oklch(0.92 0.10 75);
  --card-fg: oklch(0.18 0.04 50);
  --muted: oklch(0.55 0.10 145);
  --muted-fg: oklch(0.96 0.05 75);
  --primary: oklch(0.55 0.18 30);
  --primary-fg: oklch(0.96 0.05 75);
  --accent: oklch(0.85 0.15 85);
  --border: oklch(0.18 0.04 50);
  --ink: oklch(0.18 0.04 50);
  --font-display: "Big Shoulders Display", sans-serif;
  --font-body: "Big Shoulders Display", sans-serif;
  --radius: 0;
  --border-width: 4px;
  --pattern: repeating-linear-gradient(45deg, transparent, transparent 10px, oklch(0.18 0.04 50 / 0.04) 10px, oklch(0.18 0.04 50 / 0.04) 11px);
}

[data-theme="vintage-travel"] {
  --bg: oklch(0.86 0.05 80);
  --fg: oklch(0.18 0.02 50);
  --card: oklch(0.95 0.04 80);
  --card-fg: oklch(0.18 0.02 50);
  --muted: oklch(0.55 0.06 175);
  --muted-fg: oklch(0.95 0.04 80);
  --primary: oklch(0.62 0.20 35);
  --primary-fg: oklch(0.95 0.04 80);
  --accent: oklch(0.78 0.14 80);
  --border: oklch(0.55 0.16 35);
  --ink: oklch(0.18 0.02 50);
  --font-display: "Playfair Display", serif;
  --font-body: "Playfair Display", serif;
  --radius: 0;
  --border-width: 3px;
  --pattern: radial-gradient(circle, oklch(0.18 0.02 50 / 0.06) 1px, transparent 1.5px);
  background-size: 4px 4px;
}

[data-theme="cutout-collage"] {
  --bg: oklch(0.93 0.04 85);
  --fg: oklch(0.22 0.02 60);
  --card: oklch(0.91 0.03 85);
  --card-fg: oklch(0.22 0.02 60);
  --muted: oklch(0.78 0.15 85);
  --muted-fg: oklch(0.30 0.04 60);
  --primary: oklch(0.60 0.13 55);
  --primary-fg: oklch(0.98 0.02 85);
  --accent: oklch(0.48 0.08 145);
  --border: oklch(0.55 0.06 70);
  --ink: oklch(0.22 0.02 60);
  --font-display: "Caveat", cursive;
  --font-body: "Caveat", cursive;
  --radius: 2px;
  --border-width: 2px;
  --pattern: none;
}

[data-theme="doodle"] {
  --bg: oklch(0.97 0.03 90);
  --fg: oklch(0.20 0 0);
  --card: oklch(0.98 0.02 90);
  --card-fg: oklch(0.20 0 0);
  --muted: oklch(0.85 0.08 90);
  --muted-fg: oklch(0.20 0 0);
  --primary: oklch(0.85 0.16 80);
  --primary-fg: oklch(0.20 0 0);
  --accent: oklch(0.75 0.16 130);
  --border: oklch(0.20 0 0);
  --ink: oklch(0.20 0 0);
  --font-display: "Patrick Hand", cursive;
  --font-body: "Patrick Hand", cursive;
  --radius: 20px;
  --border-width: 2px;
  --pattern: radial-gradient(circle, oklch(0.20 0 0 / 0.05) 1px, transparent 1.5px);
  background-size: 8px 8px;
}

[data-theme="watercolor"] {
  --bg: oklch(0.99 0.01 80);
  --fg: oklch(0.30 0.04 60);
  --card: oklch(0.97 0.02 85);
  --card-fg: oklch(0.30 0.04 60);
  --muted: oklch(0.85 0.06 110);
  --muted-fg: oklch(0.40 0.04 60);
  --primary: oklch(0.72 0.13 65);
  --primary-fg: oklch(0.30 0.04 60);
  --accent: oklch(0.65 0.13 25);
  --border: oklch(0.85 0.04 85);
  --ink: oklch(0.30 0.04 60);
  --font-display: "Caveat", cursive;
  --font-body: "Caveat", cursive;
  --radius: 18px;
  --border-width: 1px;
  --pattern: radial-gradient(ellipse, oklch(0.72 0.13 65 / 0.18), transparent 70%);
  background-size: 240px 240px;
  background-position: center;
}

[data-theme="isometric"] {
  --bg: oklch(0.91 0.07 75);
  --fg: oklch(0.25 0.04 60);
  --card: oklch(0.95 0.07 85);
  --card-fg: oklch(0.25 0.04 60);
  --muted: oklch(0.55 0.06 100);
  --muted-fg: oklch(0.95 0.04 85);
  --primary: oklch(0.55 0.10 100);
  --primary-fg: oklch(0.95 0.06 85);
  --accent: oklch(0.72 0.13 65);
  --border: oklch(0.40 0.05 80);
  --ink: oklch(0.25 0.04 60);
  --font-display: "Inter", sans-serif;
  --font-body: "Inter", sans-serif;
  --radius: 16px;
  --border-width: 1px;
  --pattern: linear-gradient(135deg, oklch(0.55 0.06 100 / 0.08), transparent 40%);
}

[data-theme="neo-brutalism"] {
  --bg: oklch(1 0 0);
  --fg: oklch(0.10 0 0);
  --card: oklch(1 0 0);
  --card-fg: oklch(0.10 0 0);
  --muted: oklch(0.85 0.22 110);
  --muted-fg: oklch(0.10 0 0);
  --primary: oklch(0.85 0.22 110);
  --primary-fg: oklch(0.10 0 0);
  --accent: oklch(0.70 0.20 200);
  --border: oklch(0.10 0 0);
  --ink: oklch(0.10 0 0);
  --font-display: "Mochiy Pop One", sans-serif;
  --font-body: "Mochiy Pop One", sans-serif;
  --radius: 24px;
  --border-width: 3px;
  --pattern: none;
}

/* ============================================================
   BASE LAYOUT
   ============================================================ */

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  background-image: var(--pattern);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.5;
  min-height: 100vh;
  transition: background-color 0.3s, color 0.3s;
}

a { color: inherit; text-decoration: none; }

.app {
  max-width: 1120px;
  margin: 0 auto;
  padding: 24px;
}

/* HEADER */
header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 24px;
  border-bottom: var(--border-width) solid var(--border);
  margin-bottom: 32px;
  flex-wrap: wrap;
  gap: 12px;
}

.brand {
  font-family: var(--font-display);
  font-size: 22px;
  font-weight: 900;
  letter-spacing: -0.02em;
}

.theme-dots {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}

.theme-dot {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  border: 2px solid var(--ink);
  cursor: pointer;
  transition: transform 0.15s;
  padding: 0;
  background: transparent;
}
.theme-dot:hover { transform: scale(1.2); }
.theme-dot.is-active { transform: scale(1.35); box-shadow: 0 0 0 3px var(--bg), 0 0 0 5px var(--ink); }
.theme-dot[data-theme="ligne-claire"]      { background-color: oklch(0.70 0.16 65); }
.theme-dot[data-theme="memphis"]           { background-color: oklch(0.68 0.24 5); }
.theme-dot[data-theme="pop-art"]           { background-color: oklch(0.88 0.20 95); }
.theme-dot[data-theme="vintage-tiki"]      { background-color: oklch(0.55 0.18 30); }
.theme-dot[data-theme="vintage-travel"]    { background-color: oklch(0.62 0.20 35); }
.theme-dot[data-theme="cutout-collage"]    { background-color: oklch(0.60 0.13 55); }
.theme-dot[data-theme="doodle"]            { background-color: oklch(0.85 0.16 80); }
.theme-dot[data-theme="watercolor"]        { background-color: oklch(0.72 0.13 65); }
.theme-dot[data-theme="isometric"]         { background-color: oklch(0.55 0.10 100); }
.theme-dot[data-theme="neo-brutalism"]     { background-color: oklch(0.85 0.22 110); }

.lang-toggle {
  display: inline-flex;
  border: var(--border-width) solid var(--border);
  border-radius: 999px;
  overflow: hidden;
  font-family: var(--font-display);
}
.lang-toggle button {
  background: transparent;
  border: 0;
  padding: 6px 12px;
  font-size: 13px;
  cursor: pointer;
  color: var(--fg);
}
.lang-toggle button.is-active { background: var(--primary); color: var(--primary-fg); }

/* BENTO GRID */
.bento {
  display: grid;
  gap: 16px;
  grid-template-columns: 1fr;
  grid-template-areas: "main" "photo" "mood";
}
@media (min-width: 768px) {
  .bento {
    grid-template-columns: 1fr 1fr;
    grid-template-areas: "main main" "photo mood";
  }
}
@media (min-width: 1024px) {
  .bento {
    grid-template-columns: 2fr 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    grid-template-areas:
      "main photo"
      "main mood";
    min-height: 480px;
  }
}

.card {
  background: var(--card);
  color: var(--card-fg);
  border: var(--border-width) solid var(--border);
  border-radius: var(--radius);
  padding: 28px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  position: relative;
  overflow: hidden;
  transition: transform 0.2s, border-color 0.2s;
}
.card:hover { transform: translateY(-2px); }

.card[data-area="main"]   { grid-area: main; }
.card[data-area="photo"]  { grid-area: photo; }
.card[data-area="mood"]   { grid-area: mood; }

.eyebrow {
  font-family: var(--font-display);
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--muted-fg);
}

.title {
  font-family: var(--font-display);
  font-size: clamp(28px, 4vw, 48px);
  font-weight: 900;
  line-height: 1.05;
  letter-spacing: -0.02em;
  margin-top: 4px;
}

.subtitle {
  font-size: 16px;
  color: var(--muted-fg);
  max-width: 32em;
}

.card-title {
  font-family: var(--font-display);
  font-size: 24px;
  font-weight: 900;
  line-height: 1.1;
}

.card-body {
  font-size: 15px;
  color: var(--muted-fg);
}

.cta {
  align-self: flex-start;
  background: var(--primary);
  color: var(--primary-fg);
  border: var(--border-width) solid var(--ink);
  border-radius: var(--radius);
  padding: 12px 20px;
  font-family: var(--font-display);
  font-weight: 900;
  font-size: 16px;
  cursor: pointer;
  transition: transform 0.1s, box-shadow 0.1s;
}
.cta:hover { transform: translate(-2px, -2px); box-shadow: 4px 4px 0 0 var(--ink); }
.cta:active { transform: translate(0, 0); box-shadow: none; }

.result {
  display: none;
  align-items: center;
  gap: 12px;
  font-family: var(--font-display);
  font-size: 24px;
  font-weight: 900;
  padding: 16px;
  background: var(--muted);
  border: var(--border-width) dashed var(--ink);
  border-radius: var(--radius);
  margin-top: auto;
}
.result.is-shown { display: flex; }

/* ============================================================
   PER-THEME REVEAL ANIMATIONS
   ============================================================ */

@keyframes ligne-reveal { from { opacity: 0; letter-spacing: 0.5em; } to { opacity: 1; letter-spacing: 0; } }
@keyframes memphis-reveal { 0% { transform: scale(0.5) rotate(-12deg); opacity: 0; } 60% { transform: scale(1.15) rotate(4deg); } 100% { transform: scale(1) rotate(0); } }
@keyframes popart-reveal { 0% { transform: scale(0.3); opacity: 0; } 70% { transform: scale(1.08); } 100% { transform: scale(1); opacity: 1; } }
@keyframes tiki-reveal { 0% { transform: translateX(40px) rotate(8deg); opacity: 0; } 100% { transform: translateX(0) rotate(0); opacity: 1; } }
@keyframes travel-reveal { 0% { transform: translateY(-30px) scale(1.05); filter: blur(4px); opacity: 0; } 100% { transform: translateY(0) scale(1); filter: blur(0); opacity: 1; } }
@keyframes cutout-reveal { 0% { transform: rotateY(-90deg); opacity: 0; } 100% { transform: rotateY(0); opacity: 1; } }
@keyframes doodle-reveal { 0% { transform: scale(0.6) rotate(-3deg); } 50% { transform: scale(1.1) rotate(2deg); } 100% { transform: scale(1) rotate(0); } }
@keyframes watercolor-reveal { 0% { filter: blur(8px); opacity: 0; transform: scale(0.95); } 100% { filter: blur(0); opacity: 1; transform: scale(1); } }
@keyframes iso-reveal { 0% { transform: rotateY(-30deg) rotateX(20deg); opacity: 0; } 100% { transform: rotateY(0) rotateX(0); opacity: 1; } }
@keyframes brutal-reveal { 0% { transform: translate(8px, 8px); opacity: 0; border-style: dashed; } 50% { border-style: solid; } 100% { transform: translate(0,0); opacity: 1; } }

[data-theme="ligne-claire"]    .result.is-shown { animation: ligne-reveal 0.9s ease-out both; }
[data-theme="memphis"]         .result.is-shown { animation: memphis-reveal 0.4s cubic-bezier(.34,1.56,.64,1) both; }
[data-theme="pop-art"]         .result.is-shown { animation: popart-reveal 0.45s cubic-bezier(.34,1.56,.64,1) both; }
[data-theme="vintage-tiki"]    .result.is-shown { animation: tiki-reveal 0.6s ease-out both; }
[data-theme="vintage-travel"]  .result.is-shown { animation: travel-reveal 0.7s ease-out both; }
[data-theme="cutout-collage"]  .result.is-shown { animation: cutout-reveal 0.6s ease-out both; }
[data-theme="doodle"]          .result.is-shown { animation: doodle-reveal 0.7s cubic-bezier(.34,1.56,.64,1) both; }
[data-theme="watercolor"]      .result.is-shown { animation: watercolor-reveal 1.1s ease-out both; }
[data-theme="isometric"]       .result.is-shown { animation: iso-reveal 0.7s ease-out both; }
[data-theme="neo-brutalism"]   .result.is-shown { animation: brutal-reveal 0.35s steps(6, end) both; }

/* ============================================================
   FOOTER
   ============================================================ */
footer {
  text-align: center;
  padding: 24px;
  font-size: 12px;
  color: var(--muted-fg);
  border-top: var(--border-width) solid var(--border);
  margin-top: 32px;
}

/* reduce motion respect */
@media (prefers-reduced-motion: reduce) {
  .result.is-shown { animation: none !important; }
  * { transition: none !important; }
}
</style>
</head>
<body data-theme="ligne-claire">
<div class="app">
  <header>
    <div class="brand">whattodrink</div>
    <div class="theme-dots" role="group" aria-label="主題切換">
      <button class="theme-dot" data-theme="ligne-claire"     title="Ligne Claire"    aria-label="Ligne Claire"></button>
      <button class="theme-dot" data-theme="memphis"          title="Memphis"         aria-label="Memphis"></button>
      <button class="theme-dot" data-theme="pop-art"          title="Pop Art"         aria-label="Pop Art"></button>
      <button class="theme-dot" data-theme="vintage-tiki"     title="Vintage Tiki"    aria-label="Vintage Tiki"></button>
      <button class="theme-dot" data-theme="vintage-travel"   title="Vintage Travel"  aria-label="Vintage Travel"></button>
      <button class="theme-dot" data-theme="cutout-collage"   title="Cutout Collage"  aria-label="Cutout Collage"></button>
      <button class="theme-dot" data-theme="doodle"           title="Doodle"          aria-label="Doodle"></button>
      <button class="theme-dot" data-theme="watercolor"       title="Watercolor"      aria-label="Watercolor"></button>
      <button class="theme-dot" data-theme="isometric"        title="Isometric"       aria-label="Isometric"></button>
      <button class="theme-dot" data-theme="neo-brutalism"    title="Neo-Brutalism"   aria-label="Neo-Brutalism"></button>
    </div>
    <div class="lang-toggle" role="group" aria-label="語言切換">
      <button data-lang="zh-Hant" class="is-active">繁</button>
      <button data-lang="zh-Hans">简</button>
      <button data-lang="en">EN</button>
    </div>
  </header>

  <main>
    <section class="bento">
      <article class="card" data-area="main" data-card="random-pick">
        <span class="eyebrow">主卡片 · 今晚喝咩</span>
        <h1 class="title">讓天意決定你今晚喝什麼</h1>
        <p class="subtitle">風格: <strong data-theme-label>ligne-claire</strong>。點下方按鈕體驗該風格的開獎動畫。</p>
        <button class="cta" id="pick-btn">讓天意決定</button>
        <div class="result" id="result" data-style="ligne-claire">
          <span style="font-size:32px">🍻</span>
          <span>今晚喝 Heineken</span>
        </div>
      </article>

      <article class="card" data-area="photo" data-card="photo-pick">
        <span class="eyebrow">拍照選酒</span>
        <h2 class="card-title">看到喜歡的酒？</h2>
        <p class="card-body">拍下酒標或酒櫃，AI 幫你判斷適不適合你。</p>
      </article>

      <article class="card" data-area="mood" data-card="mood-rec">
        <span class="eyebrow">心情推薦</span>
        <h2 class="card-title">今晚心情如何？</h2>
        <p class="card-body">說一個情緒字，AI 為你推薦最合適的那一杯。</p>
      </article>
    </section>
  </main>

  <footer>
    © 2026 whattodrink · POC 主題評估 · 風格可即時切換 · 尊重 <code>prefers-reduced-motion</code>
  </footer>
</div>

<script>
// Theme switcher — click dot to switch
const dots = document.querySelectorAll(".theme-dot");
const label = document.querySelector("[data-theme-label]");
const result = document.getElementById("result");
const pickBtn = document.getElementById("pick-btn");

function setActiveDot(id) {
  dots.forEach(d => d.classList.toggle("is-active", d.dataset.theme === id));
}

dots.forEach(dot => {
  dot.addEventListener("click", () => {
    const id = dot.dataset.theme;
    document.body.dataset.theme = id;
    setActiveDot(id);
    if (label) label.textContent = id;
    if (result) {
      result.dataset.style = id;
      result.classList.remove("is-shown");
    }
  });
});
setActiveDot(document.body.dataset.theme);

// Language switcher (visual only for POC)
document.querySelectorAll(".lang-toggle button").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".lang-toggle button").forEach(b => b.classList.remove("is-active"));
    btn.classList.add("is-active");
  });
});

// Random pick — re-trigger animation by removing + re-adding class
const beers = ["Heineken", "Asahi 生啤", "Malbec 2021", "山崎 12 年", "Mojito", "獺祭 純米大吟釀"];
pickBtn.addEventListener("click", () => {
  const pick = beers[Math.floor(Math.random() * beers.length)];
  result.querySelector("span:last-child").textContent = "今晚喝 " + pick;
  result.classList.remove("is-shown");
  void result.offsetWidth; // restart animation
  result.classList.add("is-shown");
});
</script>
