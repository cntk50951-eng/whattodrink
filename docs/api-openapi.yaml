      required: [favorites, likes, dislikes]
      properties:
        favorites:
          type: array
          items:
            $ref: "#/components/schemas/TasteKey"
        likes:
          type: array
          items:
            $ref: "#/components/schemas/TasteKey"
        dislikes:
          type: array
          items:
            $ref: "#/components/schemas/TasteKey"
    TasteInference:
      type: object
      description: 口味推测（确定性聚合 v1，非 AI；groups 归一 max=1.0；sample<5 groups []，UR E.28）
      required: [sample_count, computed_at, groups]
      properties:
        sample_count:
          type: integer
        computed_at:
          type: string
          format: date-time
        groups:
          type: array
          items:
            type: object
            required: [key, strength, items]
            properties:
              key:
                type: string
              strength:
                type: number
              items:
                type: array
                items:
                  type: object
                  required: [key, strength]
                  properties:
                    key:
                      type: string
                    strength:
                      type: number
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    InvalidParams:
      description: 入參非法（sort／limit／cursor）
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
    Unauthorized:
      description: 未登录（缺或坏 JWT）
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
    NotFound:
      description: 對象不存在（不可見行同此回，fail-closed 不辨真假）
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
    Internal:
      description: 服務端錯（DB／RLS 未開會在 server log 留 code 細節）
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
    TranscribeBadRequest:
      description: bad-audio / bad-request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/TranscribeError"
    TranscribeMissingKeys:
      description: missing-keys（未配訊飛 key）
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/TranscribeError"
    TranscribeProviderError:
      description: provider-error（訊飛 ASR 101-110）
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/TranscribeError"
