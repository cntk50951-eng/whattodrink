          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/conversations/{id}:
    delete:
      operationId: hideConversation
      summary: 刪會話（只藏自己，需登录，D.2）
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 已藏（對方不受影響）
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: 非成員（fail-closed）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/conversations/{id}/messages:
    get:
      operationId: listMessages
      summary: 對話記錄（倒序 keyset 回正序，需登录，D.3）
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
        - name: cursor
          in: query
          description: 上一頁最舊一條的不透明游标，第一页不传
          schema:
            type: string
      responses:
        "200":
          description: 一页消息（由舊到新；壞行已跳過）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessagePage"
        "400":
          $ref: "#/components/responses/InvalidParams"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: 非成員（fail-closed）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "500":
          $ref: "#/components/responses/Internal"
    post:
      operationId: sendMessage
      summary: 發送（首期只收 text，需登录，D.3：隱身任一端 403＋限流＋冪等；E.13 text 可帶分享附件一枚）
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, body, client_msg_id]
              properties:
                kind:
                  type: string
                  enum: [text]
                body:
                  type: string
                  maxLength: 2000
                client_msg_id:
                  type: string
                  description: 冪等鍵（同會話同鍵重發回既有行，不 double）
                attachments:
                  type: array
                  maxItems: 1
                  description: E.13 站内分享（僅 [{checkin_id}]；僅自家帖＋對方須可見，作者／隱身 403；place 為可選地點展示文本，非坐標）
                  items:
                    type: object
                    required: [checkin_id]
                    properties:
                      checkin_id:
                        type: string
                        format: uuid
                      place:
                        type: string
                        maxLength: 120
      responses:
        "201":
          description: 發送成功（duplicate=true 即冪等命中回既有行）
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    $ref: "#/components/schemas/ChatMessage"
                  duplicate:
                    type: boolean
        "400":
          $ref: "#/components/responses/InvalidParams"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: 隱身任一端（不可收發）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "404":
          description: 非成員（fail-closed）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "429":
          description: 限流（30/min 或 200/day）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "500":
          $ref: "#/components/responses/Internal"
components:
  schemas:
    WallAuthor:
      type: object
      nullable: true
      description: 發過公開帖的作者公開列；已刪號用户為 null
      properties:
        nickname:
          type: string
        avatar_url:
          type: string
          nullable: true
        gender:
          type: string
          enum: [male, female, secret]
    WallPost:
      type: object
      required: [id, photo, note, transcript, audioSeconds, audioUrl, likes, likedByMe, createdAt, author]
      properties:
        id:
          type: string
          format: uuid
        photo:
          type: string
          nullable: true
          description: checkin-photos 公開 URL（無圖為 null，前端退佔位）
        note:
          type: string
        transcript:
          type: string
        audioSeconds:
          type: integer
          nullable: true
        audioUrl:
          type: string
          nullable: true
        likes:
          type: integer
          minimum: 0
        likedByMe:
          type: boolean
          description: 公開牆匿名固定 false（登入牆以後版本）
        createdAt:
          type: integer
          description: Epoch ms
        author:
          $ref: "#/components/schemas/WallAuthor"
    WallPage:
      type: object
      required: [posts, nextCursor]
      properties:
        posts:
          type: array
          items:
            $ref: "#/components/schemas/WallPost"
        nextCursor:
          type: string
          nullable: true
          description: 下一頁 cursor；null＝到底了
    Me:
      type: object
      required: [id, nickname, avatar_url, gender, mode, mode_updated_at]
      description: 自己的 profile 公開列＋可見模式（A.16；E.18 加 dob／bio／onboarded_at／created_at）
      properties:
        id:
          type: string
          format: uuid
        nickname:
          type: string
        avatar_url:
          type: string
          nullable: true
        gender:
          type: string
          enum: [male, female, secret]
        dob:
          type: string
          format: date
          nullable: true
        bio:
          type: string
          nullable: true
        onboarded_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        mode:
          type: string
          enum: [stealth, friends, public]
        mode_updated_at:
          type: string
          format: date-time
    CheckResult:
      type: object
      required: [is_friend]
      description: 是否為好友（任一方向 accepted，A.17）
      properties:
        is_friend:
          type: boolean
    ConversationRef:
      type: object
      required: [id, created]
      description: 會話引用（D.2 find-or-create；created=false 即去重命中既有）
      properties:
        id:
          type: string
          format: uuid
        created:
          type: boolean
    ChatPeer:
      type: object
      required: [user_id, nickname, avatar_url]
      description: 對方公開三列（精確坐標／email 永不回，D.2）
      properties:
        user_id:
          type: string
          format: uuid
        nickname:
          type: string
        avatar_url:
          type: string
          nullable: true
    FriendListItem:
      type: object
      required: [user_id, nickname, avatar_url, online]
      description: 好友列表行（D.4；online＝非隱身＋5min 窗）
      properties:
        user_id:
          type: string
          format: uuid
        nickname:
          type: string
        avatar_url:
          type: string
          nullable: true
        online:
          type: boolean
    ChatMessage:
      type: object
      required: [id, sender_id, kind, body, created_at]
      description: 單條消息（created_at 為毫秒 epoch；D.2）
      properties:
        id:
          type: string
          format: uuid
        sender_id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [text, image, audio]
        body:
          type: string
          nullable: true
        created_at:
          type: integer
    Conversation:
      type: object
      required: [id, peer, last_message, unread, muted, updated_at]
      description: 會話行（未讀由水位現算；updated_at＝末動毫秒 epoch，排序鍵，D.2）
      properties:
        id:
          type: string
          format: uuid
        peer:
          $ref: "#/components/schemas/ChatPeer"
          nullable: true
        last_message:
          $ref: "#/components/schemas/ChatMessage"
          nullable: true
        unread:
          type: integer
        muted:
          type: boolean
        updated_at:
          type: integer
    ConversationPage:
      type: object
      required: [conversations, nextCursor]
      properties:
        conversations:
          type: array
          items:
            $ref: "#/components/schemas/Conversation"
        nextCursor:
          type: string
          nullable: true
          description: 下一頁 cursor；null＝到底了
    MessagePage:
      type: object
      required: [messages, nextCursor]
      properties:
        messages:
          type: array
          items:
            $ref: "#/components/schemas/ChatMessage"
        nextCursor:
          type: string
          nullable: true
          description: 下一頁 cursor（更舊）；null＝到底了
    FriendResult:
      type: object
      required: [status]
      description: 加好友結果（pending＝邀請在途，accepted＝已是好友，DEF-009）
      properties:
        status:
          type: string
          enum: [pending, accepted]
    LiveFriend:
      type: object
      required: [user_id, nickname, avatar_url, lat, lng, updated_at]
      description: 在線好友實時位一行（server 已過濾互好友＋非隱身＋5min 鮮，A.21）
      properties:
        user_id:
          type: string
          format: uuid
        nickname:
          type: string
        avatar_url:
          type: string
          nullable: true
        lat:
          type: number
        lng:
          type: number
        updated_at:
          type: integer
          description: last_seen_at epoch ms（鮮度憑證）
    MapPin:
      type: object
      required: [id, lat, lng, area, drinkName, drinkEmoji, nickname, avatarUrl, gender, checkedInAt, isOnline]
      properties:
        id:
          type: string
          format: uuid
        lat:
          type: number
          description: 模糊后纬度（3位小数，约100m街区）
        lng:
          type: number
          description: 模糊后经度（3位小数，约100m街区）
        area:
          type: string
          nullable: true
        drinkName:
          type: string
          nullable: true
        drinkEmoji:
          type: string
          nullable: true
        nickname:
          type: string
          nullable: true
        avatarUrl:
          type: string
          nullable: true
        gender:
          type: string
          nullable: true
        photoThumb:
          type: string
          nullable: true
          description: 他人釘縮影（96px data: URL；舊帖／無圖即 null，UR E.20）
        kind:
          type: string
          enum: [flash, post]
          nullable: true
          description: 快貼種類（iOS 剩餘时间＋種類詞用；舊數據 null）
        expiresAt:
          type: string
          format: date-time
          nullable: true
          description: 快贴过期 ISO（永久帖／舊數據 null；剩余计算 iOS 做）
        note:
          type: string
          nullable: true
          description: 打卡原文（iOS pill 走馬燈用；空串／舊帖即 null，截斷 iOS 側，E.20 round-2）
        checkedInAt:
          type: integer
          description: Epoch ms
        isOnline:
          type: boolean
          description: users.last_seen_at 5min 窗内算在线
    MapPinsPage:
      type: object
      required: [pins]
      properties:
        pins:
          type: array
          items:
            $ref: "#/components/schemas/MapPin"
    Checkin:
      type: object
      required: [id, beer_id, lat, lng, place_name, kind, visibility, expires_at, created_at]
      properties:
        id:
          type: string
          format: uuid
        beer_id:
          type: string
        lat:
          type: number
        lng:
          type: number
        place_name:
          type: string
          nullable: true
        kind:
          type: string
          enum: [flash, post]
        visibility:
          type: string
          enum: [private, public, friends]
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: flash 為 created_at+24h，post 為 null
        created_at:
          type: string
          format: date-time
        photo_url:
          type: string
          nullable: true
          description: UR E.2 三件套回顯
        note:
          type: string
          nullable: true
          description: UR E.2 三件套回顯
        audio_url:
          type: string
          nullable: true
          description: UR E.2 三件套回顯
        audio_seconds:
          type: number
          nullable: true
          description: UR E.2 三件套回顯
        transcript:
          type: string
          nullable: true
          description: UR E.2 三件套回顯
    MineRow:
      type: object
      required: [id, beer_id, lat, lng, place_name, kind, visibility, expires_at, created_at, beers]
      properties:
        id:
          type: string
          format: uuid
        beer_id:
          type: string
          nullable: true
        lat:
          type: number
          nullable: true
        lng:
          type: number
          nullable: true
        place_name:
          type: string
          nullable: true
        kind:
          type: string
          enum: [flash, post]
        visibility:
          type: string
          enum: [private, public, friends]
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: flash 為 created_at+24h，post 為 null
        created_at:
          type: string
          format: date-time
        beers:
          type: object
          nullable: true
          properties:
            id:
              type: string
            name:
              type: string
            emoji:
              type: string
            category:
              type: string
            tagline:
              type: string
            icon_url:
              type: string
              nullable: true
    MinePage:
      type: object
      required: [checkins]
      properties:
        checkins:
          type: array
          items:
            $ref: "#/components/schemas/MineRow"
    Comment:
      type: object
      required: [id, checkin_id, body, status, created_at, author]
      properties:
        id:
          type: string
          format: uuid
        checkin_id:
          type: string
          format: uuid
        body:
          type: string
          maxLength: 500
        status:
          type: string
          enum: [visible, hidden]
        created_at:
          type: string
          format: date-time
        author:
          type: object
          required: [kind]
          properties:
            kind:
              type: string
              enum: [user, anon]
            user_id:
              type: string
              format: uuid
              description: kind=user 時有值
            name:
              type: string
              nullable: true
              description: kind=user 時的暱稱（缺行回 null，前端兜底）
            tag:
              type: string
              description: kind=anon 時有值（匿名·短號 4 碼）
        is_author:
          type: boolean
          description: 是否帖作者（路由按帖歸屬算，DEF-20261003-001）
        is_mine:
          type: boolean
          description: 是否我发的（登录按 user_id／匿名按 cookie；遊客 false）
    CommentsPage:
      type: object
      required: [comments, nextCursor]
      properties:
        comments:
          type: array
          items:
            $ref: "#/components/schemas/Comment"
        nextCursor:
          type: string
          nullable: true
          description: 不透明 keyset cursor（created_at＋id），無下一頁為 null
    Beer:
      type: object
      required: [id, emoji, name, category, tagline, icon_url]
      properties:
        id:
          type: string
        emoji:
          type: string
        name:
          type: string
        category:
          type: string
        tagline:
          type: string
        icon_url:
          type: string
          nullable: true
          description: 自畫圖標公開 URL，NULL 回退 emoji
    BeersPage:
      type: object
      required: [beers]
      properties:
        beers:
          type: array
          items:
            $ref: "#/components/schemas/Beer"
    HealthPage:
      type: object
      required: [ok, time, supabase]
      properties:
        ok:
          type: boolean
          description: 固定 true（health 永遠 200）
        time:
          type: string
          format: date-time
        supabase:
          type: object
          required: [configured]
          properties:
            configured:
              type: boolean
            url:
              type: string
              nullable: true
            missing:
              type: array
              nullable: true
              items:
                type: string
    TranscribeRequest:
      type: object
      required: [audioBase64]
      properties:
        audioBase64:
          type: string
          description: 16k 單聲道 WAV base64（含 44B 頭，服務端自行切 PCM）
    TranscribeResponse:
      type: object
      required: [text, accent]
      properties:
        text:
          type: string
        accent:
          type: string
          nullable: true
          enum: [cantonese, mandarin, english, null]
          description: 首個非空結果的語種，皆空為 null
    TranscribeError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum: [bad-request, bad-audio, missing-keys, provider-error]
        message:
          type: string
    ErrorBody:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    InvalidParams:
      description: 入參非法（sort／limit／cursor）
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
    Unauthorized:
      description: 未登录（缺或坏 JWT）
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
    NotFound:
      description: 對象不存在（不可見行同此回，fail-closed 不辨真假）
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
    Internal:
      description: 服務端錯（DB／RLS 未開會在 server log 留 code 細節）
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
    TranscribeBadRequest:
      description: bad-audio / bad-request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/TranscribeError"
    TranscribeMissingKeys:
      description: missing-keys（未配訊飛 key）
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/TranscribeError"
    TranscribeProviderError:
      description: provider-error（訊飛 ASR 101-110）
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/TranscribeError"
