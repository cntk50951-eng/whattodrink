    get:
      operationId: getLiveFriends
      summary: 在線好友實時位列表（需登录；互好友＋雙方非隱身＋5min 鮮，server 過濾；查看者隱身回 []，A.21）
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 可見好友實時位（空即無人可見，不過濾理由不回，避免探測）
          content:
            application/json:
              schema:
                type: object
                required: [friends]
                properties:
                  friends:
                    type: array
                    items:
                      $ref: "#/components/schemas/LiveFriend"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/Internal"
    get:
      operationId: getBeers
      summary: 酒目錄（公開，A.4-1 首條）
      description: 匿名可調，無參數，RLS `beers public read`，壞行整批 500
      responses:
        "200":
          description: 酒表全量（按 id 排序）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BeersPage"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/health:
    get:
      operationId: getHealth
      summary: 健康探針（永遠 200）
      description: 不鑑權，僅自檢 `NEXT_PUBLIC_SUPABASE_*` 是否配齊
      responses:
        "200":
          description: ok 與 supabase 配置狀態
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthPage"
  /api/v1/transcribe:
    post:
      operationId: postTranscribeV1
      summary: 語音轉文字（版本化，A.4 起主路徑）
      description: 與 `POST /api/transcribe` 同邏輯，僅前綴版本化；舊路徑保留半年
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TranscribeRequest"
      responses:
        "200":
          description: 轉寫結果（粵→普→英擇一，空為 "")
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscribeResponse"
        "400":
          description: bad-audio / bad-request（沿用舊信封 `{code,message}`，非 `error` 包絡）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscribeError"
        "500":
          description: missing-keys（未配訊飛 key）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscribeError"
        "502":
          description: provider-error（訊飛 ASR 101-110）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscribeError"
  /api/transcribe:
    post:
      operationId: postTranscribeLegacy
      summary: 語音轉文字（舊前綴，deprecated）
      deprecated: true
      description: 已上線舊路徑，邏輯同 `POST /api/v1/transcribe`，保留半年後下線
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TranscribeRequest"
      responses:
        "200":
          description: 轉寫結果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscribeResponse"
        "400":
          $ref: "#/components/responses/TranscribeBadRequest"
        "500":
          $ref: "#/components/responses/TranscribeMissingKeys"
        "502":
          $ref: "#/components/responses/TranscribeProviderError"
  /api/v1/conversations:
    post:
      operationId: createConversation
      summary: 建會話（find-or-create；需登录，D.2）
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id]
              properties:
                user_id:
                  type: string
                  description: 對方 user id（須 accepted 互好友＋雙非隱身，否則 403）
      responses:
        "201":
          description: 建會話成功（created=false 即既有會話去重命中）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationRef"
        "400":
          $ref: "#/components/responses/InvalidParams"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: 非好友／隱身（陌生人永不）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "404":
          description: 找不到该用户
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "500":
          $ref: "#/components/responses/Internal"
    get:
      operationId: listConversations
      summary: 消息列表（需登录，D.2：對方簡檔＋末條＋未讀數）
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
        - name: cursor
          in: query
          description: 上一頁最后一个會話的不透明游标（base64url JSON），第一页不传
          schema:
            type: string
      responses:
        "200":
          description: 一页會話（末動倒序；只含未藏未過期）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationPage"
        "400":
          $ref: "#/components/responses/InvalidParams"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/conversations/{id}/read:
    patch:
      operationId: markConversationRead
      summary: 讀水位（需登录，D.2）
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [last_read_at]
              properties:
                last_read_at:
                  type: integer
                  description: 已讀到的毫秒 epoch（server 不猜時鐘）
      responses:
        "200":
          description: 水位已更新
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  last_read_at:
                    type: integer
        "400":
          $ref: "#/components/responses/InvalidParams"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: 非成員（fail-closed，不透露存在性）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/conversations/{id}:
    delete:
      operationId: hideConversation
      summary: 刪會話（只藏自己，需登录，D.2）
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 已藏（對方不受影響）
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: 非成員（fail-closed）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/conversations/{id}/messages:
    get:
      operationId: listMessages
      summary: 對話記錄（倒序 keyset 回正序，需登录，D.3）
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
        - name: cursor
          in: query
          description: 上一頁最舊一條的不透明游标，第一页不传
          schema:
            type: string
      responses:
        "200":
          description: 一页消息（由舊到新；壞行已跳過）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessagePage"
        "400":
          $ref: "#/components/responses/InvalidParams"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: 非成員（fail-closed）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "500":
          $ref: "#/components/responses/Internal"
    post:
      operationId: sendMessage
      summary: 發送（text／image／audio；需登录；隱身任一端 403＋限流＋冪等；E.13 text 可帶分享附件一枚；D.8 image caption＋文件存在性＋413，UR D.8）
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, client_msg_id]
              properties:
                kind:
                  type: string
                  enum: [text, image, audio]
                body:
                  type: string
                  maxLength: 2000
                  description: text 正文必填；image 選填 caption；audio 不带（帶即 400）
                client_msg_id:
                  type: string
                  description: 冪等鍵（同會話同鍵重發回既有行，不 double）
                attachments:
                  type: array
                  maxItems: 1
                  description: text 可填分享一枚；image／audio 必填文件一枚（path 須自己首段；大小申报±10% 验真）
                  items:
                    oneOf:
                      - title: 打卡分享
                        type: object
                        required: [checkin_id]
                        properties:
                          checkin_id:
                            type: string
                            format: uuid
                          place:
                            type: string
                            maxLength: 120
                      - title: 上傳文件
                        type: object
                        required: [path, mime, bytes]
                        properties:
                          kind:
                            type: string
                            enum: [file]
                          bucket:
                            type: string
                            enum: [chat-images, chat-voice]
                          path:
                            type: string
                            description: sign 回的 path（首段須是自己）
                          mime:
                            type: string
                          bytes:
                            type: integer
                          secs:
                            type: integer
                            description: audio 專用（1–60s）
      responses:
        "201":
          description: 發送成功（duplicate=true 即冪等命中回既有行）
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    $ref: "#/components/schemas/ChatMessage"
                  duplicate:
                    type: boolean
        "400":
          $ref: "#/components/responses/InvalidParams"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: 隱身任一端（不可收發）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "404":
          description: 非成員（fail-closed）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "413":
          description: bytes 超桶上限（sign／send 附件；web 只判 ok 不分码）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "429":
          description: 限流（30/min 或 200/day）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/uploads/sign:
    post:
      operationId: signUpload
      summary: 簽名上傳 URL（chat-images／chat-voice／avatars；直傳前置，D.6；D.8 加 sha256＋expires_at，UR D.8）
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [purpose, ext, bytes]
              properties:
                purpose:
                  type: string
                  enum: [image, voice, avatar]
                ext:
                  type: string
                bytes:
                  type: integer
                sha256:
                  type: string
                  description: 可選 hex64；有即確定性 path，同值重簽同址
      responses:
        "200":
          description: 簽名成功（path server 生成；uploadUrl 直傳；expires_at 毫秒 epoch，簽名固定 2h 有效）
          content:
            application/json:
              schema:
                type: object
                required: [bucket, path, uploadUrl, expires_at]
                properties:
                  bucket:
                    type: string
                  path:
                    type: string
                  uploadUrl:
                    type: string
                    format: uri
                  expires_at:
                    type: integer
        "400":
          $ref: "#/components/responses/InvalidParams"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          description: bytes 超桶上限
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/uploads/view:
    post:
      operationId: signViewUrl
      summary: 播時簽名下載 URL（私有桶；自己或互好友可簽，陌生人 404，D.6）
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bucket, path]
              properties:
                bucket:
                  type: string
                  enum: [chat-images, chat-voice]
                path:
                  type: string
      responses:
        "200":
          description: 簽名成功（url 120s 有效）
          content:
            application/json:
              schema:
                type: object
                required: [url]
                properties:
                  url:
                    type: string
                    format: uri
        "400":
          $ref: "#/components/responses/InvalidParams"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: 文件不存在或無權（不泄存在性）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/news:
    get:
      operationId: listNews
      summary: 酒闻列表（匿名可看；region 缺省 hk 严格相等；published_at 倒序，UR E.24）
      parameters:
        - name: region
          in: query
          schema:
            type: string
            enum: [hk, cn, both]
        - name: limit
          in: query
          schema:
            type: integer
        - name: cursor
          in: query
          description: published_at ISO（keyset 下一页）
          schema:
            type: string
      responses:
        "200":
          description: 酒闻行（iOS NewsItem 1:1）
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/NewsItem"
        "400":
          $ref: "#/components/responses/InvalidParams"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/parties/mine/today:
    delete:
      operationId: purgeMyPartiesToday
      summary: 测试清数（iOS 联调专用；删我今天 HK 窗内所有局，joins 级联；上线前 prod 关闭，UR E.25）
      x-test-only: true
      security:
        - cookieAuth: []
      responses:
        "200":
          description: "{deleted: n}"
          content:
            application/json:
              schema:
                type: object
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: 端点未上线（env 未开，iOS toast 即走）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/invites/mine/today:
    delete:
      operationId: purgeMyInvitesToday
      summary: 测试清数（iOS 联调专用；删我今天 HK 窗内发出的邀约，不碰好友；上线前 prod 关闭，UR E.25）
      x-test-only: true
      security:
        - cookieAuth: []
      responses:
        "200":
          description: "{deleted: n}"
          content:
            application/json:
              schema:
                type: object
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: 端点未上线（env 未开，iOS toast 即走）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "500":
          $ref: "#/components/responses/Internal"
components:
  schemas:
    WallAuthor:
      type: object
      nullable: true
      description: 發過公開帖的作者公開列；已刪號用户為 null
      properties:
        nickname:
          type: string
        avatar_url:
          type: string
          nullable: true
        gender:
          type: string
          enum: [male, female, secret]
    WallPost:
      type: object
      required: [id, photo, note, transcript, audioSeconds, audioUrl, likes, likedByMe, createdAt, author]
      properties:
        id:
          type: string
          format: uuid
        photo:
          type: string
          nullable: true
          description: checkin-photos 公開 URL（無圖為 null，前端退佔位）
        note:
          type: string
        transcript:
          type: string
        audioSeconds:
          type: integer
          nullable: true
        audioUrl:
          type: string
          nullable: true
        likes:
          type: integer
          minimum: 0
        likedByMe:
          type: boolean
          description: 公開牆匿名固定 false（登入牆以後版本）
        createdAt:
          type: integer
          description: Epoch ms
        author:
          $ref: "#/components/schemas/WallAuthor"
    WallPage:
      type: object
      required: [posts, nextCursor]
      properties:
        posts:
          type: array
          items:
            $ref: "#/components/schemas/WallPost"
        nextCursor:
          type: string
          nullable: true
          description: 下一頁 cursor；null＝到底了
    Me:
      type: object
      required: [id, nickname, avatar_url, gender, mode, mode_updated_at]
      description: 自己的 profile 公開列＋可見模式（A.16；E.18 加 dob／bio／onboarded_at／created_at）
      properties:
        id:
          type: string
          format: uuid
        nickname:
          type: string
        avatar_url:
          type: string
          nullable: true
        gender:
          type: string
          enum: [male, female, secret]
        dob:
          type: string
          format: date
          nullable: true
        bio:
          type: string
          nullable: true
        onboarded_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        mode:
          type: string
          enum: [stealth, friends, public]
        mode_updated_at:
          type: string
          format: date-time
        preferences:
          $ref: "#/components/schemas/TastePreferences"
    CheckResult:
      type: object
      required: [is_friend]
      description: 是否為好友（任一方向 accepted，A.17）
      properties:
        is_friend:
          type: boolean
    ConversationRef:
      type: object
      required: [id, created]
      description: 會話引用（D.2 find-or-create；created=false 即去重命中既有）
      properties:
        id:
          type: string
          format: uuid
        created:
          type: boolean
    ChatPeer:
      type: object
      required: [user_id, nickname, avatar_url]
      description: 對方公開三列（精確坐標／email 永不回，D.2）
      properties:
        user_id:
          type: string
          format: uuid
        nickname:
          type: string
        avatar_url:
          type: string
          nullable: true
    FriendListItem:
      type: object
      required: [user_id, nickname, avatar_url, online]
      description: 好友列表行（D.4；online＝非隱身＋5min 窗）
      properties:
        user_id:
          type: string
          format: uuid
        nickname:
          type: string
        avatar_url:
          type: string
          nullable: true
        online:
          type: boolean
    ChatMessage:
      type: object
      required: [id, sender_id, kind, body, created_at]
      description: 單條消息（created_at 為毫秒 epoch；D.2；D.8 加 attachments 回显＋mime／bytes／secs 顶层）
      properties:
        id:
          type: string
          format: uuid
        sender_id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [text, image, audio]
        body:
          type: string
          nullable: true
        created_at:
          type: integer
        attachments:
          type: array
          description: 文件／分享附件（server 寫入已驗；讀端只渲染）
          items:
            type: object
        mime:
          type: string
          nullable: true
          description: 首个文件附件 mime；文本／分享即 null
        bytes:
          type: integer
          nullable: true
        secs:
          type: integer
          nullable: true
          description: audio 專用秒數
    Conversation:
      type: object
      required: [id, peer, last_message, unread, muted, updated_at]
      description: 會話行（未讀由水位現算；updated_at＝末動毫秒 epoch，排序鍵，D.2）
      properties:
        id:
          type: string
          format: uuid
        peer:
          $ref: "#/components/schemas/ChatPeer"
          nullable: true
        last_message:
          $ref: "#/components/schemas/ChatMessage"
          nullable: true
        unread:
          type: integer
        muted:
          type: boolean
        updated_at:
          type: integer
    ConversationPage:
      type: object
      required: [conversations, nextCursor]
      properties:
        conversations:
          type: array
          items:
            $ref: "#/components/schemas/Conversation"
        nextCursor:
          type: string
          nullable: true
          description: 下一頁 cursor；null＝到底了
    MessagePage:
      type: object
      required: [messages, nextCursor]
      properties:
        messages:
          type: array
          items:
            $ref: "#/components/schemas/ChatMessage"
        nextCursor:
          type: string
          nullable: true
          description: 下一頁 cursor（更舊）；null＝到底了
    FriendResult:
      type: object
      required: [status]
      description: 加好友結果（pending＝邀請在途，accepted＝已是好友，DEF-009）
      properties:
        status:
          type: string
          enum: [pending, accepted]
    LiveFriend:
      type: object
      required: [user_id, nickname, avatar_url, lat, lng, updated_at]
      description: 在線好友實時位一行（server 已過濾互好友＋非隱身＋5min 鮮，A.21）
      properties:
        user_id:
          type: string
          format: uuid
        nickname:
          type: string
        avatar_url:
          type: string
