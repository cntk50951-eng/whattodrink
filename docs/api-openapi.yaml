    get:
      operationId: getHealth
      summary: 健康探針（永遠 200）
      description: 不鑑權，僅自檢 `NEXT_PUBLIC_SUPABASE_*` 是否配齊
      responses:
        "200":
          description: ok 與 supabase 配置狀態
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthPage"
  /api/v1/transcribe:
    post:
      operationId: postTranscribeV1
      summary: 語音轉文字（版本化，A.4 起主路徑）
      description: 與 `POST /api/transcribe` 同邏輯，僅前綴版本化；舊路徑保留半年
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TranscribeRequest"
      responses:
        "200":
          description: 轉寫結果（粵→普→英擇一，空為 "")
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscribeResponse"
        "400":
          description: bad-audio / bad-request（沿用舊信封 `{code,message}`，非 `error` 包絡）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscribeError"
        "500":
          description: missing-keys（未配訊飛 key）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscribeError"
        "502":
          description: provider-error（訊飛 ASR 101-110）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscribeError"
  /api/transcribe:
    post:
      operationId: postTranscribeLegacy
      summary: 語音轉文字（舊前綴，deprecated）
      deprecated: true
      description: 已上線舊路徑，邏輯同 `POST /api/v1/transcribe`，保留半年後下線
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TranscribeRequest"
      responses:
        "200":
          description: 轉寫結果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscribeResponse"
        "400":
          $ref: "#/components/responses/TranscribeBadRequest"
        "500":
          $ref: "#/components/responses/TranscribeMissingKeys"
        "502":
          $ref: "#/components/responses/TranscribeProviderError"
  /api/v1/conversations:
    post:
      operationId: createConversation
