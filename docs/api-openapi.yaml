openapi: 3.1.0
info:
  title: whattodrink API
  version: 1.1.0
  description: >
    三端同一契約（web／iOS／Android 以此為準，改契約先改此檔）。
    成功回裸數據對象，失敗回 {error:{code,message}}＋對應 HTTP 狀態
    （見 lib/api/envelope.ts）。`GET /beers/health` 與 `POST /transcribe`
    為已上線但前期漏入規的端點，本版補齊（§9 演進要求版本化）。
paths:
  /api/v1/wall:
    get:
      operationId: getWall
      summary: 公開牆（免登入）
      parameters:
        - name: sort
          in: query
          schema:
            type: string
            enum: [hot, latest]
            default: latest
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
        - name: cursor
          in: query
          description: 上一頁最后一个帖子的不透明游标（base64url JSON），第一页不传
          schema:
            type: string
      responses:
        "200":
          description: 一页公开帖（只含 visibility=public 行＋公开列）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WallPage"
        "400":
          $ref: "#/components/responses/InvalidParams"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/map/pins:
    get:
      operationId: getMapPins
      summary: 地图他人 Pin（免登入，坐标模糊到街区）
      parameters:
        - name: bbox
          in: query
          required: true
          description: west,south,east,north 逗号分隔（经度 -180~180，纬度 -90~90，west<east 且 south<north，面积≤2deg²）
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 100
      responses:
        "200":
          description: BBOX 内公开打卡（坐标已截断至 3 位小数约 100m，无精确值；private 行不回）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MapPinsPage"
        "400":
          $ref: "#/components/responses/InvalidParams"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/checkins:
    post:
      operationId: postCheckin
      summary: 打卡落库（需登录，A.12 雙類型：flash 24h / post 永久，visibility 由 users.mode 派生）
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [beer_id, lat, lng]
              properties:
                beer_id:
                  type: string
                lat:
                  type: number
                  minimum: -90
                  maximum: 90
                lng:
                  type: number
                  minimum: -180
                  maximum: 180
                place_name:
                  type: string
                  nullable: true
                  maxLength: 200
                kind:
                  type: string
                  enum: [flash, post]
                  default: flash
                  description: 快貼 24h / 帖子永久，未傳按 flash 回兼容
      responses:
        "201":
          description: 落库成功
          content:
            application/json:
              schema:
                type: object
                required: [checkin]
                properties:
                  checkin:
                    $ref: "#/components/schemas/Checkin"
        "403":
          description: 隱身模式不可打卡（A.12 模式權限）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "400":
          $ref: "#/components/responses/InvalidParams"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/checkins/mine:
    get:
      operationId: getMyCheckins
      summary: 我的打卡历史（需登录，type=want）
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 30
      responses:
        "200":
          description: 倒序（新在前）我的打卡，含 beers join
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MinePage"
        "400":
          $ref: "#/components/responses/InvalidParams"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/beers:
    get:
      operationId: getBeers
      summary: 酒目錄（公開，A.4-1 首條）
      description: 匿名可調，無參數，RLS `beers public read`，壞行整批 500
      responses:
        "200":
          description: 酒表全量（按 id 排序）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BeersPage"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/health:
    get:
      operationId: getHealth
      summary: 健康探針（永遠 200）
      description: 不鑑權，僅自檢 `NEXT_PUBLIC_SUPABASE_*` 是否配齊
      responses:
        "200":
          description: ok 與 supabase 配置狀態
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthPage"
  /api/v1/transcribe:
    post:
      operationId: postTranscribeV1
      summary: 語音轉文字（版本化，A.4 起主路徑）
      description: 與 `POST /api/transcribe` 同邏輯，僅前綴版本化；舊路徑保留半年
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TranscribeRequest"
      responses:
        "200":
          description: 轉寫結果（粵→普→英擇一，空為 "")
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscribeResponse"
        "400":
          description: bad-audio / bad-request（沿用舊信封 `{code,message}`，非 `error` 包絡）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscribeError"
        "500":
          description: missing-keys（未配訊飛 key）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscribeError"
        "502":
          description: provider-error（訊飛 ASR 101-110）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscribeError"
  /api/transcribe:
    post:
      operationId: postTranscribeLegacy
      summary: 語音轉文字（舊前綴，deprecated）
      deprecated: true
      description: 已上線舊路徑，邏輯同 `POST /api/v1/transcribe`，保留半年後下線
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TranscribeRequest"
      responses:
        "200":
          description: 轉寫結果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscribeResponse"
        "400":
          $ref: "#/components/responses/TranscribeBadRequest"
        "500":
          $ref: "#/components/responses/TranscribeMissingKeys"
        "502":
          $ref: "#/components/responses/TranscribeProviderError"
components:
  schemas:
    WallAuthor:
      type: object
      nullable: true
      description: 發過公開帖的作者公開列；已刪號用户為 null
      properties:
        nickname:
          type: string
        avatar_url:
          type: string
          nullable: true
        gender:
          type: string
          enum: [male, female, secret]
    WallPost:
      type: object
      required: [id, photo, note, transcript, audioSeconds, audioUrl, likes, likedByMe, createdAt, author]
      properties:
        id:
          type: string
          format: uuid
        photo:
          type: string
          nullable: true
          description: checkin-photos 公開 URL（無圖為 null，前端退佔位）
        note:
          type: string
        transcript:
          type: string
        audioSeconds:
          type: integer
          nullable: true
        audioUrl:
          type: string
          nullable: true
        likes:
          type: integer
          minimum: 0
        likedByMe:
          type: boolean
          description: 公開牆匿名固定 false（登入牆以後版本）
        createdAt:
          type: integer
          description: Epoch ms
        author:
          $ref: "#/components/schemas/WallAuthor"
    WallPage:
      type: object
      required: [posts, nextCursor]
      properties:
        posts:
          type: array
          items:
            $ref: "#/components/schemas/WallPost"
        nextCursor:
          type: string
          nullable: true
          description: 下一頁 cursor；null＝到底了
    MapPin:
      type: object
      required: [id, lat, lng, area, drinkName, drinkEmoji, nickname, avatarUrl, gender, checkedInAt, isOnline]
      properties:
        id:
          type: string
          format: uuid
        lat:
          type: number
          description: 模糊后纬度（3位小数，约100m街区）
        lng:
          type: number
          description: 模糊后经度（3位小数，约100m街区）
        area:
          type: string
          nullable: true
        drinkName:
          type: string
          nullable: true
        drinkEmoji:
          type: string
          nullable: true
        nickname:
          type: string
          nullable: true
        avatarUrl:
          type: string
          nullable: true
        gender:
          type: string
          nullable: true
        checkedInAt:
          type: integer
          description: Epoch ms
        isOnline:
          type: boolean
          description: users.last_seen_at 5min 窗内算在线
    MapPinsPage:
      type: object
      required: [pins]
      properties:
        pins:
          type: array
          items:
            $ref: "#/components/schemas/MapPin"
    Checkin:
      type: object
      required: [id, beer_id, lat, lng, place_name, kind, visibility, expires_at, created_at]
      properties:
        id:
          type: string
          format: uuid
        beer_id:
          type: string
        lat:
          type: number
        lng:
          type: number
        place_name:
          type: string
          nullable: true
        kind:
          type: string
          enum: [flash, post]
        visibility:
          type: string
          enum: [private, public, friends]
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: flash 為 created_at+24h，post 為 null
        created_at:
          type: string
          format: date-time
    MineRow:
      type: object
      required: [id, beer_id, lat, lng, place_name, kind, visibility, expires_at, created_at, beers]
      properties:
        id:
          type: string
          format: uuid
        beer_id:
          type: string
          nullable: true
        lat:
          type: number
          nullable: true
        lng:
          type: number
          nullable: true
        place_name:
          type: string
          nullable: true
        kind:
          type: string
          enum: [flash, post]
        visibility:
          type: string
          enum: [private, public, friends]
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: flash 為 created_at+24h，post 為 null
        created_at:
          type: string
          format: date-time
        beers:
          type: object
          nullable: true
          properties:
            id:
              type: string
            name:
              type: string
            emoji:
              type: string
            category:
              type: string
            tagline:
              type: string
            icon_url:
              type: string
              nullable: true
    MinePage:
      type: object
      required: [checkins]
      properties:
        checkins:
          type: array
          items:
            $ref: "#/components/schemas/MineRow"
    Beer:
      type: object
      required: [id, emoji, name, category, tagline, icon_url]
      properties:
        id:
          type: string
        emoji:
          type: string
        name:
          type: string
        category:
          type: string
        tagline:
          type: string
        icon_url:
          type: string
          nullable: true
          description: 自畫圖標公開 URL，NULL 回退 emoji
    BeersPage:
      type: object
      required: [beers]
      properties:
        beers:
          type: array
          items:
            $ref: "#/components/schemas/Beer"
    HealthPage:
      type: object
      required: [ok, time, supabase]
      properties:
        ok:
          type: boolean
          description: 固定 true（health 永遠 200）
        time:
          type: string
          format: date-time
        supabase:
          type: object
          required: [configured]
          properties:
            configured:
              type: boolean
            url:
              type: string
              nullable: true
            missing:
              type: array
              nullable: true
              items:
                type: string
    TranscribeRequest:
      type: object
      required: [audioBase64]
      properties:
        audioBase64:
          type: string
          description: 16k 單聲道 WAV base64（含 44B 頭，服務端自行切 PCM）
    TranscribeResponse:
      type: object
      required: [text, accent]
      properties:
        text:
          type: string
        accent:
          type: string
          nullable: true
          enum: [cantonese, mandarin, english, null]
          description: 首個非空結果的語種，皆空為 null
    TranscribeError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum: [bad-request, bad-audio, missing-keys, provider-error]
        message:
          type: string
    ErrorBody:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    InvalidParams:
      description: 入參非法（sort／limit／cursor）
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
    Unauthorized:
      description: 未登录（缺或坏 JWT）
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
    Internal:
      description: 服務端錯（DB／RLS 未開會在 server log 留 code 細節）
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
    TranscribeBadRequest:
      description: bad-audio / bad-request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/TranscribeError"
    TranscribeMissingKeys:
      description: missing-keys（未配訊飛 key）
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/TranscribeError"
    TranscribeProviderError:
      description: provider-error（訊飛 ASR 101-110）
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/TranscribeError"
