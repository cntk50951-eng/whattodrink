openapi: 3.1.0
info:
  title: whattodrink API
  version: 1.10.0
  description: >
    三端同一契約（web／iOS／Android 以此為準，改契約先改此檔）。
    成功回裸數據對象，失敗回 {error:{code,message}}＋對應 HTTP 狀態
    （見 lib/api/envelope.ts）。`GET /beers/health` 與 `POST /transcribe`
    為已上線但前期漏入規的端點，本版補齊（§9 演進要求版本化）。
paths:
  /api/v1/wall:
    get:
      operationId: getWall
      summary: 公開牆（免登入；scope=friends 需登入，A.17）
      parameters:
        - name: sort
          in: query
          schema:
            type: string
            enum: [hot, latest]
            default: latest
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
        - name: cursor
          in: query
          description: 上一頁最后一个帖子的不透明游标（base64url JSON），第一页不传
          schema:
            type: string
        - name: scope
          in: query
          description: all＝公開行（免登入）；friends＝accepted 好友的 friends＋public 行（需登入，匿名＋scope 即 401）
          schema:
            type: string
            enum: [all, friends]
            default: all
      responses:
        "200":
          description: 一页帖子（all＝visibility=public 行＋公开列；friends＝好友行）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WallPage"
        "400":
          $ref: "#/components/responses/InvalidParams"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/friends/check:
    get:
      operationId: checkFriend
      summary: 查與某人是否為好友（需登录，A.17；A.19 引導浮層復用）
      security:
        - bearerAuth: []
      parameters:
        - name: user_id
          in: query
          description: 對方 user id（與 checkin_id 二選一）
          schema:
            type: string
        - name: checkin_id
          in: query
          description: 對方打卡 id（與 user_id 二選一；server 解作者再判，行不可見即非好友。A.19）
          schema:
            type: string
      responses:
        "200":
          description: 任一方向 accepted 即 true
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckResult"
        "400":
          $ref: "#/components/responses/InvalidParams"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/map/pins:
    get:
      operationId: getMapPins
      summary: 地图他人 Pin（免登入，坐标模糊到街区，UR A.13 时间窗口；scope=friends 需登入，A.17）
      parameters:
        - name: bbox
          in: query
          required: true
          description: west,south,east,north 逗号分隔（经度 -180~180，纬度 -90~90，west<east 且 south<north，面积≤2deg²）
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 100
        - name: range
          in: query
          description: 帖子回溯窗口（server side now 判定）；flash 固定 24h（expires_at>now），post 按 range 过滤（7d 预设→90d 扩展）
          schema:
            type: string
            enum: [7d, 90d]
            default: 7d
        - name: scope
          in: query
          description: all＝公開行（免登入）；friends＝accepted 好友的 friends＋public 行（需登入，匿名＋scope 即 401；friends 模式作者對非好友 isOnline=false）
          schema:
            type: string
            enum: [all, friends]
            default: all
      responses:
        "200":
          description: BBOX 内打卡（坐标已截断至 3 位小数约 100m，无精确值；private 行不回；flash 已过期不回，post 按 range；scope=friends 只回好友行）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MapPinsPage"
        "400":
          $ref: "#/components/responses/InvalidParams"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/checkins:
    post:
      operationId: postCheckin
      summary: 打卡落库（需登录，A.12 雙類型：flash 24h / post 永久，visibility 由 users.mode 派生）
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lat, lng]
              properties:
                beer_id:
                  type: string
                  nullable: true
                  description: UR E.3 酒可选——null 即纯照片打卡
                lat:
                  type: number
                  minimum: -90
                  maximum: 90
                lng:
                  type: number
                  minimum: -180
                  maximum: 180
                place_name:
                  type: string
                  nullable: true
                  maxLength: 200
                kind:
                  type: string
                  enum: [flash, post]
                  default: flash
                  description: 快貼 24h / 帖子永久，未傳按 flash 回兼容
                photo_url:
                  type: string
                  nullable: true
                  description: UR E.2 三件套——jpeg dataURL（≤1M 字符，抓幀已壓 ≤1024）
                photo_thumb:
                  type: string
                  nullable: true
                  description: UR E.20 他人釘縮影——96px jpeg dataURL（≤32K 字符，拍攝順手壓）
                note:
                  type: string
                  nullable: true
                  maxLength: 500
                  description: UR E.2 三件套——文字备注
                audio_url:
                  type: string
                  nullable: true
                  description: UR E.2 三件套——data:audio（≤2M 字符）
                audio_seconds:
                  type: number
                  nullable: true
                  minimum: 0
                  maximum: 60
                  description: UR E.2 三件套——語音秒數
                transcript:
                  type: string
                  nullable: true
                  maxLength: 2000
                  description: UR E.2 三件套——語音轉錄文本（同審）
      responses:
        "201":
          description: 落库成功（含三件套回顯，E.2）
          content:
            application/json:
              schema:
                type: object
                required: [checkin]
                properties:
                  checkin:
                    $ref: "#/components/schemas/Checkin"
        "403":
          description: 隱身模式不可打卡（A.12 模式權限）／內容未通過審核（E.2 rejected，發送工作流 fail-closed）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "400":
          $ref: "#/components/responses/InvalidParams"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/checkins/{id}:
    get:
      operationId: getCheckinDetail
      summary: 打卡詳情三件套（需登录；本人／public／互好友可見，UR E.2）
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: 照片＋文字＋語音（pins 列表不帶，開卡按需拉）
          content:
            application/json:
              schema:
                type: object
                required: [checkin]
                properties:
                  checkin:
                    type: object
                    required: [id]
                    properties:
                      id:
                        type: string
                        format: uuid
                      photo_url:
                        type: string
                        nullable: true
                      note:
                        type: string
                        nullable: true
                      audio_url:
                        type: string
                        nullable: true
                      audio_seconds:
                        type: number
                        nullable: true
                      transcript:
                        type: string
                        nullable: true
                      created_at:
                        type: string
                        format: date-time
                      place_name:
                        type: string
                        nullable: true
                      lat:
                        type: number
                        nullable: true
                      lng:
                        type: number
                        nullable: true
                      beer_name:
                        type: string
                        nullable: true
                      rating_avg:
                        type: number
                        minimum: 1
                        maximum: 5
                        nullable: true
                        description: 他人制平均（未舍入；展示取 1 位小数，UR E.12）
                      rating_count:
                        type: integer
                        minimum: 0
                      rated_by_me:
                        type: boolean
                      my_rating:
                        type: integer
                        minimum: 1
                        maximum: 5
                        nullable: true
                      is_author:
                        type: boolean
                        description: 服务端判的作者身份（分支不可信，UR E.12）
                      cheers_count:
                        type: integer
                        minimum: 0
                        description: 该帖被碰杯总数（E.14 round-4）
                      cheered_by_me:
                        type: boolean
                        description: viewer 是否已碰过（E.14 round-4）
                      recent_cheers:
                        type: array
                        maxItems: 3
                        description: 最近 3 个（倒序；MailPeer 三列＋时间；隐身者过滤，数量以 count 为准，E.14 round-4）
                        items:
                          type: object
                          required: [user_id, nickname, created_at]
                          properties:
                            user_id:
                              type: string
                              format: uuid
                            nickname:
                              type: string
                            avatar_url:
                              type: string
                              nullable: true
                            created_at:
                              type: string
                              format: date-time
                      like_count:
                        type: integer
                        minimum: 0
                      liked_by_me:
                        type: boolean
                      want_count:
                        type: integer
                        minimum: 0
                      wanted_by_me:
                        type: boolean
                      comment_count:
                        type: integer
                        minimum: 0
                      archived:
                        type: boolean
                        description: 歸檔只讀快照（E.22；主缺查歸檔，交互全禁）
        "403":
          description: 無權查看（陌生／private 他人，fail-closed）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/Internal"
    delete:
      operationId: deleteCheckin
      summary: 删除打卡（需登录；仅本人，DEF-20260929-003）
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: 删除成功（本地同步清，不再被 mine 复活）
          content:
            application/json:
              schema:
                type: object
                required: [deleted]
                properties:
                  deleted:
                    type: boolean
        "404":
          description: 不存在或非本人（不泄露归属）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/checkins/mine:
    get:
      operationId: getMyCheckins
      summary: 我的打卡历史（需登录，type=want）
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 30
      responses:
        "200":
          description: 倒序（新在前）我的打卡，含 beers join
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MinePage"
        "400":
          $ref: "#/components/responses/InvalidParams"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/checkins/{id}/comments:
    get:
      operationId: listCheckinComments
      summary: 打卡帖子留言列表（免登入；public 直讀，非公開沿可見門，UR E.7）
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
        - name: cursor
          in: query
          schema:
            type: string
            description: 不透明 keyset cursor（上一頁 nextCursor 原樣回傳）
      responses:
        "200":
          description: 新在前一頁留言（只回 visible）＋nextCursor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommentsPage"
        "400":
          $ref: "#/components/responses/InvalidParams"
        "404":
          description: 帖子不存在或無可見權限（陌生／私密不洩露，統一 404）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "500":
          $ref: "#/components/responses/Internal"
    post:
      operationId: createCheckinComment
      summary: 打卡帖子留言發表（免登入；匿名 mint cookie＋三檔限流＋審核，UR E.7）
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body:
                  type: string
                  maxLength: 500
                  description: 留言正文（去空白後 1–500 字）
      responses:
        "201":
          description: 發表成功（匿名首評帶 Set-Cookie: wtd-anon）
          content:
            application/json:
              schema:
                type: object
                required: [comment]
                properties:
                  comment:
                    $ref: "#/components/schemas/Comment"
        "400":
          $ref: "#/components/responses/InvalidParams"
        "403":
          description: 隱身禁評（A.15）／內容未通過審核（E.2 管線 rejected）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "404":
          description: 帖子不存在或無可見權限
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "429":
          description: 限流（匿名回前限 1／登入 10 分鐘 3 條／同 IP 24h 5 條）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          description: 審核服務全掛（fail-closed 不落地，沿 E.2 包絡）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /api/v1/checkins/{id}/like:
    post:
      operationId: toggleCheckinLike
      summary: 打卡点赞切换（需登录；有行删无行插，回显计数，UR E.10）
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: 切换成功（liked 本次后状态＋实时总数）
          content:
            application/json:
              schema:
                type: object
                required: [liked, like_count]
                properties:
                  liked:
                    type: boolean
                  like_count:
                    type: integer
                    minimum: 0
        "400":
          $ref: "#/components/responses/InvalidParams"
        "401":
          description: 未登录（匿名请先登录）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: 隱身禁赞（沿 E.7 评论口径）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "404":
          description: 帖子不存在或無可見權限（不泄归属）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/checkins/{id}/want:
    post:
      operationId: toggleCheckinWant
      summary: 打卡“想喝”计数切换（需登录；有行删无行插，仅计数不进推荐，UR E.10）
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: 切换成功（wanted 本次后状态＋实时总数）
          content:
            application/json:
              schema:
                type: object
                required: [wanted, want_count]
                properties:
                  wanted:
                    type: boolean
                  want_count:
                    type: integer
                    minimum: 0
        "400":
          $ref: "#/components/responses/InvalidParams"
        "401":
          description: 未登录（匿名请先登录）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: 隱身禁表态（沿 E.7 评论口径）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "404":
          description: 帖子不存在或無可見權限（不泄归属）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/checkins/{id}/ratings:
    post:
      operationId: rateCheckinByOthers
      summary: 他人制打分（需登录；仅非作者，1–5 整数或 null 撤分，upsert 覆盖，UR E.12）
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rating]
              properties:
                rating:
                  type: integer
                  minimum: 1
                  maximum: 5
                  nullable: true
      responses:
        "200":
          description: 打分成功（回本人行＋实时聚合；只吐聚合不吐谁投）
          content:
            application/json:
              schema:
                type: object
                required: [rated, my_rating, rating_avg, rating_count]
                properties:
                  rated:
                    type: boolean
                  my_rating:
                    type: integer
                    minimum: 1
                    maximum: 5
                    nullable: true
                  rating_avg:
                    type: number
                    minimum: 1
                    maximum: 5
                    nullable: true
                  rating_count:
                    type: integer
                    minimum: 0
        "400":
          $ref: "#/components/responses/InvalidParams"
        "401":
          description: 未登录（匿名请先登录）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: 作者禁投／隱身禁表态（沿 like 口径）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "404":
          description: 帖子不存在或無可見權限（不泄归属）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/cheers:
    post:
      operationId: cheersToast
      summary: 敬酒（需登录；{checkin_id}敬作者｜{to_user_id}回敬解最新可见帖；自敬／隱身 403；15／天 429；重敬 200 幂等不重计，UR E.14 round-5）
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                checkin_id:
                  type: string
                  format: uuid
                to_user_id:
                  type: string
                  format: uuid
                message:
                  type: string
                  maxLength: 200
                  description: E.15 快捷留言（可选，空即无）
              description: 二选一（双给／双空 400）
      responses:
        "200":
          description: 敬酒成功（回剩余次数＋该帖总数）
          content:
            application/json:
              schema:
                type: object
                required: [cheered, remaining, cheers_count]
                properties:
                  cheered:
                    type: boolean
                  remaining:
                    type: integer
                    minimum: 0
                  cheers_count:
                    type: integer
                    minimum: 1
        "400":
          $ref: "#/components/responses/InvalidParams"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: 自敬／隱身禁敬
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "404":
          description: 帖子不存在／無可見權限／對方暫無可敬打卡
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "429":
          description: 今日乾杯已達上限（HK 自然天 15）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "500":
          $ref: "#/components/responses/Internal"
    delete:
      operationId: uncheersCheckin
      summary: 取消碰杯（需登录；删自己在该帖的行；有帖无行也 200 幂等，404 只＝帖不存在／无权，UR E.14 round-5）
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [checkin_id]
              properties:
                checkin_id:
                  type: string
                  format: uuid
      responses:
        "200":
          description: 已取消（cheered=false 现态＋帖现总数；无行同回）
          content:
            application/json:
              schema:
                type: object
                required: [cheered, cheers_count]
                properties:
                  cheered:
                    type: boolean
                  cheers_count:
                    type: integer
                    minimum: 0
        "400":
          $ref: "#/components/responses/InvalidParams"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: 帖不存在或無可見權限（iOS 404＝帖问题）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/cheers/inbox:
    get:
      operationId: cheersInbox
      summary: 被敬收件箱（需登录；倒序 20＋未读数，UR E.14）
      security:
        - cookieAuth: []
      responses:
        "200":
          description: 收件箱（只吐敬酒人公开三列＋帖 id＋时间）
          content:
            application/json:
              schema:
                type: object
                required: [unread, items]
