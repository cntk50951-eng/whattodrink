ee_liqueur, cream_liqueur, orange_liqueur, herbal_liqueur, nut_liqueur, bitters, vodka, flavored_vodka, absinthe, aquavit, anise_spirit, fruit_wine, cider, perry, mead, chuhai, rtd, hard_seltzer, zero_beer, zero_spirit, zero_wine]
    TastePreferences:
