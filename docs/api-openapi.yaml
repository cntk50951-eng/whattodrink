        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/invites:
    post:
      operationId: sendInvite
      summary: 發約喝酒（需登录；{to_user_id}｜{checkin_id}二选一＋店1–30字＋三段時；自約／隱身 403；3／天＋同對象1／天 429，UR E.16）
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [place, slot]
              properties:
                to_user_id:
                  type: string
                  format: uuid
                checkin_id:
                  type: string
                  format: uuid
                place:
                  type: string
                  maxLength: 30
                slot:
                  type: string
                  enum: [now, half, tonight]
      responses:
        "200":
          description: 發出成功（回 id＋過期）
          content:
            application/json:
              schema:
                type: object
                required: [id, expires_at]
        "400":
          $ref: "#/components/responses/InvalidParams"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: 自約／隱身／對方隱身或屏蔽（中性文案）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "404":
          description: 對象不存在／帖子不可見
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "429":
          description: 3／天或同對象1／天
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "500":
          $ref: "#/components/responses/Internal"
    get:
      operationId: listInvites
      summary: 收發箱（需登录；?box=inbox|sent，陌生人分區客戶端按 is_friend 切，UR E.16）
      security:
        - cookieAuth: []
      responses:
        "200":
          description: 邀約行（含對方公開三列＋is_friend＋pending 數）
          content:
            application/json:
              schema:
                type: object
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/invites/{id}:
    patch:
      operationId: advanceInvite
      summary: 推進（需登录；accept｜decline｜recall；接受即自動雙向好友＋回 peer，UR E.16）
      security:
        - cookieAuth: []
      responses:
        "200":
          description: 推进成功
          content:
            application/json:
              schema:
                type: object
        "400":
          $ref: "#/components/responses/InvalidParams"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: 非當事人
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "410":
          description: 已過期（讀時判，無 cron）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/comments/{id}:
