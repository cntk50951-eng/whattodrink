        "500":
          $ref: "#/components/responses/Internal"
    get:
      operationId: listFriends
      summary: 好友列表（在線＋離線全量，需登录，D.4；只吐四列，精確坐標永不進列表）
      security:
        - bearerAuth: []
      responses:
